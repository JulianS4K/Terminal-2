<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D4 · Events</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0; padding: 16px; color: #16181d; background: #fff;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
      h1 { font-size: 16px; margin: 0; }
      .actions { display: flex; gap: 8px; }
      button { font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #c7ccd6; background: transparent; color: inherit; }
      button:hover:not(:disabled) { border-color: #8b93a3; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .note { color: #6b7280; font-size: 12px; margin: 0 0 12px; }
      #status { color: #6b7280; margin-bottom: 10px; min-height: 1em; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      li { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid #e6e8ec; border-radius: 10px; }
      li img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: #eef1f6; }
      .meta { flex: 1; min-width: 0; }
      .name { font-weight: 600; }
      .sub { color: #6b7280; font-size: 12px; }
      .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
      @media (prefers-color-scheme: dark) {
        body { color: #e7e9ee; background: #16181d; }
        li { border-color: #2a2e37; }
        li img { background: #232730; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Events</h1>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
        <button id="create" type="button" disabled title="Coming soon — not available yet">Create event</button>
        <button id="sell" type="button" disabled title="Coming soon — not available yet">Sell tickets</button>
      </div>
    </header>
    <p class="note">Read-only preview. Creating events and selling tickets are coming soon.</p>
    <div id="status">Loading…</div>
    <ul id="list"></ul>
    <script type="module" src="./src/mcp-app.ts"></script>
  </body>
</html>
