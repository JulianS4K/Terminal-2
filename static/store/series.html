<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>VibePass — series</title>
  <link rel="stylesheet" href="/static/store/style.css" />
</head>
<body data-page="series">
  <header class="topbar">
    <a class="brand" href="/store">VibePass</a>
    <div class="badge mvp">MVP · browse only · no real purchases</div>
  </header>

  <main class="wrap">
    <a class="back" href="/store">← back to events</a>

    <div id="status" class="status">Loading series…</div>

    <!-- Series header: matchup, venue, date span, branded name + rivalry
         badge when applicable. Hidden until the API resolves the series. -->
    <section id="header" class="series-head" hidden>
      <div class="series-head-row">
        <h1 id="seriesTitle"></h1>
        <span id="seriesBadges" class="series-head-badges"></span>
      </div>
      <p class="event-meta">
        <span id="seriesVenue"></span>
        <span class="dot">·</span>
        <span id="seriesDates"></span>
        <span class="dot">·</span>
        <span id="seriesCount"></span>
      </p>
      <p id="seriesFromPrice" class="event-meta sub"></p>
    </section>

    <!-- Per-game card list. Each game shows date/time, pricing, owned
         inventory, weather (when within forecast window) and any holiday
         that coincides. Clicking the card opens the standard event-detail
         filter view. -->
    <section id="games" class="series-games" hidden></section>
  </main>

  <footer class="foot">
    <span>powered by Ticket Evolution · v_mlb_game_series</span>
  </footer>

  <script src="/static/store/store.js" defer></script>
</body>
</html>
