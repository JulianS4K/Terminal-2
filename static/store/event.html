<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Title + description are overridden per-event by store.js once the
       /api/store/events/:id payload lands. These defaults are what crawlers
       that don't run JS see, and what shows briefly before JS settles. -->
  <title>VibePass — event tickets</title>
  <meta name="description" content="Direct-inventory tickets for this event on VibePass. Transparent pricing, no daisy chains." />

  <!-- Open Graph / share-card rendering. JS updates og:title, og:description,
       og:url with per-event values when the event payload resolves so share
       links render with the event name + venue + date. -->
  <meta property="og:type" content="event" />
  <meta property="og:site_name" content="VibePass" />
  <meta property="og:title" content="VibePass — event tickets" />
  <meta property="og:description" content="Direct-inventory tickets for this event." />
  <meta property="og:url" content="" />
  <meta property="og:image" content="https://vibepass-storefront-test.onrender.com/static/store/og-default.svg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VibePass — event tickets" />
  <meta name="twitter:description" content="Direct-inventory tickets for this event." />

  <link rel="icon" type="image/svg+xml" href="/static/store/favicon.svg" />
  <link rel="stylesheet" href="/static/store/style.css" />
</head>
<body data-page="event">
  <header class="topbar">
    <a class="brand" href="/store">VibePass</a>
    <div class="badge mvp">MVP · browse only · no real purchases</div>
  </header>

  <main class="wrap">
    <a class="back" href="/store">← back to events</a>

    <div id="status" class="status" aria-live="polite">Loading event…</div>

    <section id="header" class="event-head" hidden>
      <!-- Venue hero image — subtle background banner, populated when
           venue_assets.hero_image_url exists. JS sets backgroundImage
           inline; CSS handles the dim overlay so the heading stays readable. -->
      <div id="evHero" class="event-hero-bg" hidden></div>
      <div class="head-row">
        <div>
          <h1 id="evName"></h1>
          <p class="event-meta">
            <span id="evVenue"></span>
            <span class="dot">·</span>
            <span id="evDate"></span>
            <!-- Venue tags — indoor/outdoor + capacity when available -->
            <span id="evVenueTags" class="venue-tags"></span>
          </p>
          <p class="event-meta sub">
            <span id="evPerformers"></span>
          </p>
          <!-- Context strip: rivalry tag, MLB series position, tournament
               parent. All three are optional; the container stays hidden
               when none of them apply. Populated by store.js from
               res.context.{rivalry,mlb_series,tournament}. -->
          <div id="evContext" class="event-context" hidden></div>
        </div>
        <div class="head-actions">
          <span id="freshness" class="freshness"></span>
          <button class="btn ghost" id="openShare">Share this view</button>
        </div>
      </div>
    </section>

    <!-- Banner appears when a share link is being viewed (any URL filter set). -->
    <div id="sharedBanner" class="banner" hidden>
      <span id="sharedSummary"></span>
      <a href="" id="clearShared" class="banner-link">show all listings</a>
    </div>

    <section id="body" class="event-body" hidden>
      <aside class="map">
        <!-- 1x1 transparent placeholder so the browser doesn't flash a
             broken-image icon between page-load and JS setting img.src
             from the configurations API. JS replaces the src attribute
             once the seat-map URL is known. -->
        <img id="seatMap" alt="seating chart"
             src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
      </aside>

      <div class="listings">
        <h2>Available from us <span id="listCount" class="muted"></span></h2>

        <!-- Tab toggle: Seats (always) + Parking (only when at least one
             parking listing exists for this event). TEvo's ticket_groups
             type field separates 'event' (seats) from 'parking'; we keep
             them on separate tabs so parking prices don't pollute the seat
             from-price / filters. Hidden when parking_count = 0. -->
        <nav id="listingTabs" class="listing-tabs" hidden role="tablist" aria-label="Inventory type">
          <button type="button" class="listing-tab is-active" data-tab="seats" role="tab" aria-selected="true">Seats</button>
          <button type="button" class="listing-tab" data-tab="parking" role="tab" aria-selected="false">
            Parking <span id="parkingTabCount" class="listing-tab-count"></span>
          </button>
        </nav>

        <!-- Quick pricing: "at-a-glance" view of what's available by
             quantity-bucket (1 / 2 / 3 / 4 / 5+) and by section. Computed
             client-side from the same listings the server returns — no
             extra fetch, no broker-internal fields. Re-renders whenever
             renderListings() runs so filter changes update the rollup.
             Hidden when the seats list is empty (parking tab also leaves
             this strip hidden). -->
        <aside id="quickPricing" class="quick-pricing" hidden aria-label="Quick pricing">
          <div id="qpBuckets" class="qp-buckets" role="group" aria-label="From-price by quantity"></div>
          <div id="qpSections" class="qp-sections" hidden aria-label="By section"></div>
        </aside>

        <!-- Inline filters drive the page view AND the share URL. URL is the
             source of truth: every change updates ?zones=&section=&min_price=
             &max_price=&min_qty= via replaceState and re-fetches the listings.
             Zone row only renders when this event's performer+venue has
             curated zones in performer_zones. Filters apply only to Seats. -->
        <div id="filterBar" class="filter-bar">
          <div id="zoneRow" class="filter-row" hidden>
            <span id="zoneLabel" class="filter-label">Zone</span>
            <div class="chip-group" id="zoneChips" role="group" aria-labelledby="zoneLabel"></div>
          </div>
          <div id="sectionRow" class="filter-row" hidden>
            <span id="sectionLabel" class="filter-label">Section</span>
            <div class="chip-group" id="sectionChips" role="group" aria-labelledby="sectionLabel"></div>
          </div>
          <div class="filter-row inline">
            <label for="minPrice" class="filter-label">Price</label>
            <input id="minPrice" type="number" min="0" step="10" placeholder="min $" aria-label="Minimum price" />
            <input id="maxPrice" type="number" min="0" step="10" placeholder="max $" aria-label="Maximum price" />
            <label for="minQty" class="filter-label" style="margin-left:16px">Min qty</label>
            <select id="minQty" aria-label="Minimum ticket quantity">
              <option value="">any</option>
              <option value="2">2+</option>
              <option value="3">3+</option>
              <option value="4">4+</option>
              <option value="6">6+</option>
            </select>
            <button id="resetFilters" class="btn ghost" style="margin-left:auto">Reset</button>
          </div>
        </div>

        <ul id="listings" class="list"></ul>
        <p id="noListings" class="empty" hidden>
          Nothing matches those filters. Loosen them or check back — inventory shifts.
        </p>
        <!-- Parking listings (separate tab; no filters, no zones). -->
        <ul id="parkingListings" class="list parking-list" hidden></ul>
      </div>
    </section>
  </main>

  <!-- Reserve modal — appears when user clicks Reserve on a listing.
       MVP only: confirms server-side that the ticket group is still
       available and shows what a real receipt would look like. -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="close" aria-label="close" id="closeModal">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="foot">
    <nav class="foot-nav" aria-label="Footer">
      <a href="/store/about">About</a>
      <a href="/store/privacy">Privacy</a>
      <a href="/store/terms">Terms</a>
    </nav>
    <span class="foot-meta">&copy; 2026 VibePass &middot; MVP preview</span>
  </footer>

  <script src="/static/store/store.js" defer></script>
</body>
</html>
