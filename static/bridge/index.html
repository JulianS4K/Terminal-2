<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      PWA + brand meta. Theme color matches the manifest's value so
      Android's status-bar tint and the desktop install-prompt frame
      both pick up the same shade. The dark background_color in the
      manifest is what shows during the splash flash on Android.
    -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Exos" />
    <!--
      SSR_META block: for link-unfurl bots (which don't run JS), server.ts
      replaces everything between these markers with the event's / org's own
      title, description, Open Graph, Twitter and JSON-LD tags
      (Terminal-2 core/exos_seo.py). Keep the markers, and keep every tag that
      a per-page preview should override inside them.
    -->
    <!-- SSR_META_START -->
    <title>Exos | Live the Moment</title>
    <meta name="description" content="Exos — ticketing for independent venues and promoters." />

    <!--
      Social share / link-unfurl defaults (Open Graph + Twitter Card).
      These are PLACEHOLDERS that src/lib/meta.ts overwrites per-page at
      runtime (event title, poster image, canonical URL). They MUST exist
      in the initial HTML because:
        1. meta.ts can update an existing tag but can't add one in time
           for a crawler — see the contract in that file's header.
        2. Most link unfurlers (Slack, iMessage, Discord, Facebook, X)
           scrape the raw HTML WITHOUT executing JS, so these static
           defaults are the only preview they ever see. A shared root or
           org link therefore gets a branded card instead of a bare URL.
      Selectors here mirror meta.ts exactly (property=og:*, name=twitter:*)
      so its setOrCreateMeta() finds and mutates these rather than append
      duplicates. og:image uses the /bridge/-prefixed path because Vite
      does not rewrite meta content attributes the way it does href/src.
    -->
    <meta property="og:site_name" content="Exos" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Exos | Live the Moment" />
    <meta property="og:description" content="Exos — ticketing for independent venues and promoters." />
    <meta property="og:image" content="/bridge/icon-512.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Exos | Live the Moment" />
    <meta name="twitter:description" content="Exos — ticketing for independent venues and promoters." />
    <meta name="twitter:image" content="/bridge/icon-512.png" />
    <!-- SSR_META_END -->

    <!--
      iOS PWA support. Safari ignores most of the manifest, so we
      duplicate the relevant bits as <meta>. apple-touch-icon must
      be same-origin or iOS silently falls back to a screenshot.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Exos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/bridge/icon.svg" />

    <!--
      Google Fonts. Loaded from the HTML (not a CSS @import) so the browser
      discovers it immediately instead of after the app stylesheet parses.
      Only the families the design tokens in src/index.css actually use:
      Inter (sans, 400-900 minus 800), Anton (display), Special Elite (type),
      Permanent Marker (marker), JetBrains Mono (mono). gstatic (the
      font-file host) needs crossorigin because fonts are fetched anonymously.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Permanent+Marker&family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
    />

    <!-- Manifest + favicon. icon.svg renders crisp at every size. -->
    <link rel="manifest" href="/bridge/manifest.json" />
    <link rel="icon" href="/bridge/icon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/bridge/icon.svg" color="#FFE714" />

    <!--
      First-paint splash. React clears #root's contents on mount, so this
      markup is visible only during the JS download/parse window and then
      vanishes automatically — no cleanup code needed. Colors match the
      manifest background_color (#0A0A0A) + brand yellow (#FFE714) so it's
      continuous with the Android PWA splash instead of a blank flash.
      Animation is suppressed under prefers-reduced-motion.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
      }
      #boot .ring {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 231, 20, 0.2);
        border-top-color: #ffe714;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring {
          animation: none;
          border-top-color: rgba(255, 231, 20, 0.6);
        }
      }
    </style>

    <link rel="modulepreload" crossorigin href="/bridge/assets/createLucideIcon-DEe8RN8z.js">
    <link rel="modulepreload" crossorigin href="/bridge/assets/auth-Ju5b3lnT.js">
    <link rel="modulepreload" crossorigin href="/bridge/assets/decide-BjfEVeyr.js">
    <link rel="modulepreload" crossorigin href="/bridge/assets/timestamp-BGXidqJ_.js">
    <link rel="modulepreload" crossorigin href="/bridge/assets/utils-D9tWZk4e.js">
    <link rel="stylesheet" crossorigin href="/bridge/assets/index-B7DsRwUn.css">
  </head>

      <div id="boot" aria-hidden="true">
