  <style>
    /* Health-page-specific bits (style.css carries the shared chrome). */
    .hz-overall { display:flex; flex-wrap:wrap; align-items:center; gap:18px;
      padding:18px 20px; border-radius:10px; margin:14px 0; border:1px solid var(--line); }
    .hz-overall.ok   { background:#0c1c10; border-color:#1f6f3a; }
    .hz-overall.warn { background:#221b08; border-color:#8a6d1a; }
    .hz-overall.fail { background:#240d0d; border-color:#8a2222; }
    .hz-dot { width:14px; height:14px; border-radius:50%; flex:none; }
    .hz-dot.ok{background:var(--pos);} .hz-dot.warn{background:var(--warn);} .hz-dot.fail,.hz-dot.down{background:var(--neg);}
    .hz-dot.up{background:var(--pos);} .hz-dot.off{background:#555;} .hz-dot.idle{background:#3a6ea5;}
    .hz-big { font-size:20px; font-weight:700; letter-spacing:.04em; }
    .hz-metrics { display:flex; gap:26px; margin-left:auto; flex-wrap:wrap; }
    .hz-metric .v { font-size:22px; font-weight:700; }
    .hz-metric .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .hz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin:10px 0 22px; }
    .hz-card { border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:var(--panel); }
    .hz-card .row1 { display:flex; align-items:center; gap:8px; }
    .hz-card .nm { font-weight:600; }
    .hz-card .detail { color:var(--muted); font-size:12px; margin-top:6px; word-break:break-word; }
    .hz-card .up { color:var(--muted); font-size:11px; margin-top:6px; }
    .hz-pill { margin-left:auto; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; text-transform:uppercase; }
    .hz-pill.ok{background:#10331c;color:var(--pos);} .hz-pill.up{background:#10331c;color:var(--pos);}
    .hz-pill.warn{background:#332a0c;color:var(--warn);}
    .hz-pill.fail,.hz-pill.down{background:#331212;color:var(--neg);}
    .hz-pill.off{background:#1c1c1c;color:var(--muted);} .hz-pill.idle{background:#10233a;color:var(--info);}
    .hz-cron-sum { color:var(--muted); font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; }
    .hz-class { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:18px 0 6px; }
    .hz-timeline { display:flex; gap:2px; align-items:flex-end; height:34px; margin:6px 0 24px; }
    .hz-tick { flex:1 1 0; min-width:2px; height:100%; border-radius:1px; background:#1a1a1a; }
    .hz-tick.ok{background:var(--pos);} .hz-tick.warn{background:var(--warn);} .hz-tick.fail{background:var(--neg);}
    .hz-foot { color:var(--muted); font-size:12px; margin:10px 0 30px; }
  </style>
</head>
<body data-page="health">

  <header class="topbar">
    <span class="brand">TERMINAL · D0</span>
    <span id="status" class="status">—</span>
  </header>

  <main class="wrap health">
    <div class="panel-title row">
      <span>SYSTEM HEALTH · UPTIME</span>
      <a class="more-link" href="/healthz" target="_blank" rel="noopener">/healthz ↗</a>
    </div>

    <div id="hz-overall" class="hz-overall"><span class="hz-dot"></span><span class="hz-big">loading…</span></div>

    <div class="hz-class">WEB SERVICES (HTTP reachability)</div>
    <div id="hz-web" class="hz-grid"></div>

    <div class="hz-class">24H OVERALL TIMELINE (one bar per snapshot)</div>
    <div id="hz-timeline" class="hz-timeline"></div>

    <div id="hz-checks"></div>

    <div class="hz-class">CRON JOBS · 24H <span id="hz-crons-sum" class="hz-cron-sum"></span></div>
    <div id="hz-crons" class="hz-grid"></div>

    <div id="hz-foot" class="hz-foot"></div>
  </main>

  <script src="lib/supabase.js"></script>
  <script src="lib/render.js"></script>

</body>
