<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="S4K Terminal" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vibepass-storefront-test.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <title>Terminal — Trade Watch</title>
  <link rel="stylesheet" href="/static/_shared/design-tokens.css" />
  <link rel="stylesheet" href="style.css?v=20260707a" />
</head>
<body data-page="trade-watch">

  <header class="topbar">
    <span class="brand">TERMINAL · D0</span>
    <span id="status" class="status">Loading…</span>
  </header>

  <main class="wrap">
    <div class="panel-title row">
      <span>TRADE WATCH</span>
      <span class="muted small" id="twMeta"></span>
    </div>
    <p class="muted small" style="margin:2px 0 12px">
      Be the first to know when a watchlisted player moves — fuses the prediction
      market (Kalshi + Polymarket), a high-frequency Wikipedia team poll, and the
      ESPN roster into one live state. Adding a player also turns on their feeds.
    </p>

    <div class="tw-add" style="position:relative;max-width:440px;margin-bottom:16px">
      <input id="twAddInput" type="search" placeholder="＋ add player to watchlist…" autocomplete="off" spellcheck="false"
        style="width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--border,#222);background:var(--panel-2,#111);color:inherit" />
      <div id="twAddSuggest" hidden
        style="position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:3px;background:var(--panel,#161616);border:1px solid var(--border,#222);border-radius:8px;overflow:hidden"></div>
    </div>

    <section id="tw-empty" hidden><div class="empty">loading…</div></section>
    <section id="tw-body"></section>
  </main>

  <script src="lib/supabase.js"></script>
  <script src="lib/render.js"></script>
  <script src="pwa.js?v=20260702"></script>
  <script src="auth.js?v=20260608"></script>
  <script src="app.js?v=20260608"></script>
  <script src="nav.js?v=20260714tw"></script>
  <script src="trade-watch.js?v=20260714watchlist"></script>
</body>
</html>
