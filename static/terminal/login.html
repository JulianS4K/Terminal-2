<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="S4K Terminal" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vibepass-storefront-test.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Terminal — Sign in</title>
  <link rel="stylesheet" href="style.css?v=20260608" />
</head>
<body data-page="login">

  <main class="login-wrap">
    <div class="login-card">
      <div class="login-tag">TERMINAL · D0</div>
      <h1>Sign in</h1>
      <p class="login-sub">Restricted to <code>@s4kent.com</code> · same Supabase auth backend as D2's Orders Dashboard.</p>

      <button id="googleBtn" class="login-btn" type="button">
        Continue with Google
      </button>

      <div id="loginErr" class="login-err" hidden></div>
      <div id="loginInfo" class="login-info">
        After sign-in you'll bounce back to where you started.
        Session persists in <code>localStorage</code> on this origin until you sign out.
      </div>

      <div class="login-foot">
        <a href="/d2/" target="_blank" rel="noopener">D2 Orders Dashboard ↗</a>
        <span class="dot">·</span>
        <span class="muted small">vibepass-terminal-test</span>
      </div>
    </div>
  </main>

  <script src="lib/supabase.js"></script>
  <!-- Cache-busting: first-party JS/CSS carry ?v=<token>. Bump the token (date) on ANY first-party asset change so the static CDN/browser fetch fresh bundles instead of serving a stale cached copy. -->
  <script src="auth.js?v=20260608"></script>
  <script src="login.js?v=20260608"></script>
</body>
</html>
