<body data-page="transactions">

  <header class="topbar">
    <span class="brand">TERMINAL · D0</span>
    <span id="status" class="status">Loading…</span>
  </header>

  <main class="wrap transactions">

    <div class="txn-bar">
      <div class="txn-leagues" id="txnLeagues" role="tablist">
        <button class="txn-tab active" data-league="">ALL</button>
        <button class="txn-tab" data-league="NBA">NBA</button>
        <button class="txn-tab" data-league="MLB">MLB</button>
        <button class="txn-tab" data-league="NHL">NHL</button>
        <button class="txn-tab" data-league="NFL">NFL</button>
        <button class="txn-tab" data-league="WNBA">WNBA</button>
      </div>
      <select id="txnType" class="txn-type-filter" title="Filter by move type">
        <option value="">All types</option>
      </select>
      <input type="search" id="txnSearch" class="txn-search" placeholder="Search team / player / move…" autocomplete="off" spellcheck="false" />
    </div>

    <section id="txn-panel">
      <div class="panel-title row">
        <span>TRANSACTIONS</span>
        <span class="muted small" id="txnMeta"></span>
      </div>
      <div id="txnBody"><div class="empty">loading…</div></div>
    </section>

  </main>

  <script src="lib/supabase.js"></script>
  <script src="lib/render.js"></script>
  <script src="pwa.js?v=20260702"></script>
  <script src="auth.js?v=20260608"></script>
  <script src="app.js?v=20260608"></script>
  <script src="nav.js?v=20260708lg"></script>
  <script src="transactions.js?v=20260704split"></script>
