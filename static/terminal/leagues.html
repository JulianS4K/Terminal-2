  <title>Terminal — Leagues</title>

  <link rel="stylesheet" href="style.css?v=20260707a" />
  <style>
    /* Leagues hub — page-specific layout. Reuses shared tokens/classes
       (.panel-title, .empty, .muted, .num, .ours, .race-badge) from style.css;
       only the hub-unique picker/hero/KPI/ranking chrome lives here. Inline is
       CSP-allowed (style-src 'unsafe-inline'); JS must stay external.
       Colors reference the shared design tokens (design-tokens.css) and carry
       the terminal's dark values as var() fallbacks, so the page stays dark
       even if the tokens sheet fails to load (degraded CDN / direct-open) —
       the same token+fallback pattern event.js uses (see design-tokens.css). */
    /* Page background safety net — style.css sets html,body{background:var(--bg)}
       but --bg lives in design-tokens.css; re-assert the dark value with a
       fallback so the whole surface (not just the panels) stays dark if that
       sheet is missing. Identical to the token value when it loads. */
    html, body { background:var(--bg, #0a0a0a); color:var(--text, #e5e5e5); }
    .wrap.leagues { display:flex; flex-direction:column; gap:14px; }

    /* League picker — team leagues, a divider, then racing series. */
    .lg-picker { display:flex; flex-wrap:wrap; gap:6px; align-items:stretch;
      background:var(--panel, #141414); border:1px solid var(--line, #2a2a2a); border-radius:8px; padding:10px; }
    .lg-btn { display:flex; flex-direction:column; align-items:flex-start; gap:1px;
      min-width:66px; padding:6px 10px; background:var(--panel-2, #1a1a1a);
      border:1px solid var(--line, #2a2a2a); border-radius:6px; color:var(--muted, #8a8a8a);
      font-family:var(--mono, monospace); font-size:12px; font-weight:600;
      letter-spacing:.5px; cursor:pointer; transition:border-color .1s, color .1s; }
    .lg-btn:hover { color:var(--text, #e5e5e5); border-color:var(--dim, #4a4a4a); }
    .lg-btn.active { color:var(--accent, #fbbf24); border-color:var(--accent, #fbbf24); }
    .lg-btn .sub { font-size:9px; font-weight:500; letter-spacing:.5px;
      color:var(--dim, #4a4a4a); text-transform:uppercase; }
    .lg-btn.active .sub { color:var(--accent, #fbbf24); opacity:.75; }
    .lg-sep { width:1px; align-self:stretch; margin:2px 4px; background:var(--line, #2a2a2a); }

    /* Hero */
    .lg-hero { display:flex; align-items:center; gap:18px; background:var(--panel, #141414);
      border:1px solid var(--line, #2a2a2a); border-radius:8px; padding:16px 18px; }
    .lg-logo { flex:0 0 auto; width:72px; height:72px; display:flex; align-items:center;
      justify-content:center; border:1px solid var(--line, #2a2a2a); border-radius:8px;
      background:var(--panel-2, #1a1a1a); color:var(--accent, #fbbf24);
      font-family:var(--mono, monospace); font-weight:700; font-size:15px; text-align:center; line-height:1.1; }
    .lg-hero h1 { margin:0 0 4px; font-size:22px; font-weight:700; color:var(--text, #e5e5e5); }
    .lg-hero .meta { margin:0; color:var(--muted, #8a8a8a); font-size:13px; }
    .lg-hero .meta .badge { color:var(--info, #60a5fa); border:1px solid var(--info, #60a5fa);
      border-radius:4px; padding:0 5px; font-size:11px; margin-left:2px; }

    /* KPI strip */
    .kpi-strip { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
      gap:1px; background:var(--line, #2a2a2a); border:1px solid var(--line, #2a2a2a); border-radius:8px; overflow:hidden; }
    .kpi-cell { display:flex; flex-direction:column; gap:2px; padding:12px 14px; background:var(--panel, #141414); }
    .kpi-num { font-family:var(--mono, monospace); font-size:20px; font-weight:700; color:var(--text, #e5e5e5); }
    .kpi-num.ours { color:var(--accent, #fbbf24); }
    .kpi-num.warn { color:var(--warn, #f59e0b); }
    .kpi-lbl { font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted, #8a8a8a); }

    /* Sales KPI sub-strip (realized comps, season to date) */
    .lg-sales-lbl { font-size:10px; letter-spacing:.6px; text-transform:uppercase;
      color:var(--muted, #8a8a8a); margin:0 0 6px 2px; }

    /* Performers roster — linked chips, grouped by conference/division */
    .lg-performers { background:var(--panel, #141414); border:1px solid var(--line, #2a2a2a);
      border-radius:8px; padding:12px 14px; }
    .perf-group { margin-bottom:11px; }
    .perf-group:last-child { margin-bottom:0; }
    .perf-group-hd { font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
      color:var(--muted, #8a8a8a); margin:0 0 6px; padding-bottom:3px; border-bottom:1px solid var(--line-2, #1f1f1f); }
    .dm-name .dm-div { color:var(--dim, #4a4a4a); font-size:10px; font-weight:500; margin-left:5px; }
    .perf-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .perf-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 9px;
      background:var(--panel-2, #1a1a1a); border:1px solid var(--line, #2a2a2a); border-radius:5px;
      color:var(--text, #e5e5e5); font-size:12px; text-decoration:none; }
    .perf-chip:hover { border-color:var(--accent, #fbbf24); color:var(--accent, #fbbf24); text-decoration:none; }
    .perf-chip .pc-ev { color:var(--muted, #8a8a8a); font-size:10px; font-family:var(--mono, monospace); }
    .perf-chip.plain { color:var(--muted, #8a8a8a); cursor:default; }
    .perf-chip.plain:hover { border-color:var(--line, #2a2a2a); color:var(--muted, #8a8a8a); }

    /* Game slate — upcoming league games (per-game, event-linked) */
    .lg-slate { background:var(--panel, #141414); border:1px solid var(--line, #2a2a2a);
      border-radius:8px; padding:12px 14px; }
    #lgSlateBody table tr.slate-row { cursor:pointer; }
    #lgSlateBody table tr.slate-row:hover td { background:var(--panel-2, #1a1a1a); }
    .slate-blind { color:var(--warn, #f59e0b); font-size:10px; font-weight:600; margin-left:6px; }
    /* Primary face (AXS/Ticketmaster). Highlighted green when the resale market
       trades below the primary face price. */
    .face-cell { color:var(--info, #60a5fa); }
    .face-below { color:var(--pos, #34d399); font-weight:700; }
    .slate-div { color:var(--dim, #4a4a4a); font-size:10px; margin-left:6px; }

    /* Two-pane grid: ranking/schedule (wide) + teams/standings */
    .lg-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; align-items:start; }
    /* An explicit display: grid outranks the UA [hidden]{display:none}, so
       re-assert none for the Broadway view where the grid is hidden. */
    .lg-grid[hidden] { display:none; }
    @media (max-width: 900px) { .lg-grid { grid-template-columns:1fr; } }
    .lg-grid > section { background:var(--panel, #141414); border:1px solid var(--line, #2a2a2a);
      border-radius:8px; padding:12px 14px; min-width:0; }

    /* Demand ranking rows (team leagues) */
    .dm-row { display:grid; grid-template-columns:26px 1fr 76px 60px; align-items:center;
      gap:8px; padding:5px 0; border-bottom:1px solid var(--line-2, #1f1f1f); }
    .dm-row:last-child { border-bottom:0; }
    .dm-rank { font-family:var(--mono, monospace); font-size:12px; color:var(--muted, #8a8a8a); text-align:right; }
    .dm-name { min-width:0; }
    .dm-name a, .dm-name span.nm { color:var(--text, #e5e5e5); font-weight:600; font-size:13px; }
    .dm-name a:hover { color:var(--accent, #fbbf24); }
    .dm-bar { height:5px; margin-top:4px; background:var(--panel-2, #1a1a1a); border-radius:3px; overflow:hidden; }
    .dm-bar-fill { height:100%; background:var(--accent, #fbbf24); opacity:.7; border-radius:3px; }
    .dm-val { font-family:var(--mono, monospace); font-size:12px; text-align:right; color:var(--text, #e5e5e5); }
    .dm-owned { font-family:var(--mono, monospace); font-size:12px; text-align:right; }
    .dm-owned.ours { color:var(--accent, #fbbf24); }
    .blind-dot { color:var(--warn, #f59e0b); margin-left:4px; cursor:help; }
    .lg-note { margin-top:8px; color:var(--dim, #4a4a4a); font-size:11px; }
  </style>
</head>
<body data-page="leagues">

  <header class="topbar">
    <span class="brand">TERMINAL · D0</span>
    <span id="status" class="status">Loading…</span>
  </header>

  <main class="wrap leagues">

    <!-- League picker — team leagues (ESPN-tracked) + racing series. Built by JS. -->
    <div class="lg-picker" id="lgPicker" role="tablist" aria-label="League picker">
      <div class="empty muted small">loading leagues…</div>
    </div>

    <!-- Hero -->
    <section class="lg-hero" id="lgHero">
      <div class="lg-logo" id="lgLogo">—</div>
      <div class="lg-hero-meta">
        <h1 id="lgName">—</h1>
        <p class="meta"><span id="lgSub">—</span> <span class="badge">ESPN</span></p>
      </div>
    </section>

    <!-- KPI strip (market / inventory) -->
    <section class="kpi-strip" id="lgStrip"></section>

    <!-- Sales KPIs (realized comps, season to date) — team leagues only -->
    <section id="lgSales" hidden>
      <div class="lg-sales-lbl">SALES · SEASON TO DATE — realized comps</div>
      <div class="kpi-strip" id="lgSalesStrip"></div>
    </section>

    <!-- Performers roster — every performer in the league, linked to its page.
         Team leagues only; hidden for racing series (drivers aren't performers). -->
    <section class="lg-performers" id="lgPerformers" hidden>
      <div class="panel-title row">
        <span id="lgPerformersTitle">PERFORMERS</span>
        <span class="muted small" id="lgPerformersMeta"></span>
      </div>
      <div id="lgPerformersBody"><div class="empty">loading…</div></div>
    </section>

    <!-- Game slate — upcoming games in the league, event-linked. Team leagues
         only; racing uses the SCHEDULE panel below instead. -->
    <section class="lg-slate" id="lgSlate" hidden>
      <div class="panel-title row">
        <span id="lgSlateTitle">GAME SLATE</span>
        <span class="muted small" id="lgSlateMeta"></span>
      </div>
      <div id="lgSlateBody"><div class="empty">loading…</div></div>
    </section>

    <!-- Primary (ranking / schedule) + secondary (blind spots / standings).
         Hidden for Broadway (a performer category — no home/road ranking). -->
    <div class="lg-grid" id="lgGrid">
      <section id="lgPrimary">
        <div class="panel-title row">
          <span id="lgPrimaryTitle">—</span>
          <span class="muted small" id="lgPrimaryMeta"></span>
        </div>
        <div id="lgPrimaryBody"><div class="empty">loading…</div></div>
      </section>
      <section id="lgSecondary">
        <div class="panel-title row">
          <span id="lgSecondaryTitle">—</span>
          <span class="muted small" id="lgSecondaryMeta"></span>
        </div>
        <div id="lgSecondaryBody"><div class="empty">loading…</div></div>
      </section>
    </div>

    <!-- Racing results drawer (revealed when a completed race is clicked) -->
    <section id="lgResults" hidden>
      <div class="panel-title row">
        <span id="lgResultsTitle">RACE RESULTS</span>
        <a href="#" class="muted small" id="lgResultsClose">✕ close</a>
      </div>
      <div id="lgResultsBody"><div class="empty">loading…</div></div>
    </section>

  </main>

  <script src="lib/supabase.js"></script>
  <script src="lib/render.js"></script>
  <script src="pwa.js?v=20260702"></script>
  <script src="auth.js?v=20260608"></script>
  <script src="app.js?v=20260608"></script>
  <script src="nav.js?v=20260708lg"></script>
  <script src="leagues.js?v=20260708lg9"></script>
</body>
</html>
