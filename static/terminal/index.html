<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://vibepass-storefront-test.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Terminal — Event</title>
  <link rel="stylesheet" href="/static/terminal/lib/uplot.min.css" />
  <link rel="stylesheet" href="/static/terminal/style.css" />
</head>
<body data-page="event">

  <header class="topbar">
    <span class="brand">TERMINAL · D0</span>
    <span id="status" class="status">Loading…</span>
  </header>

  <main class="wrap">
    <section id="hero">
      <div>
        <h1 class="title" id="evTitle">—</h1>
        <p class="meta">
          <span id="evVenue">—</span>
          <span class="dot">·</span>
          <span id="evDate">—</span>
        </p>
        <div class="badges" id="evBadges"></div>
        <div class="coverage" id="coverage">
          <span class="lbl">COVERAGE</span>
          <span class="light" data-src="tevo"     title="TEvo"></span>
          <span class="light" data-src="seatgeek" title="SeatGeek"></span>
          <span class="light" data-src="seatdata" title="SeatData"></span>
          <span class="light" data-src="espn"     title="ESPN"></span>
        </div>
      </div>
    </section>

    <section id="kpi">
      <div class="kpi-label">OWNED PREMIUM PCT</div>
      <div class="kpi-value" id="kpiVal">—</div>
      <div class="kpi-sub"   id="kpiSub">our asks vs market not us</div>
    </section>

    <section id="chart">
      <div class="chart-title">
        <span>PRICE &amp; INVENTORY · 7D</span>
        <span class="legend">
          <span><i style="background:var(--accent)"></i> Owned median</span>
          <span><i style="background:var(--muted)"></i> Market median</span>
          <span><i style="background:var(--info)"></i> Owned qty</span>
        </span>
      </div>
      <div id="chartHost"></div>
    </section>

    <section id="zones">
      <div class="panel-title">ZONES — LATEST SNAPSHOT</div>
      <div id="zonesBody"></div>
    </section>

    <section id="order-strip">
      <div class="panel-title">ORDERS — STATE MIX</div>
      <div id="ordersBody"></div>
    </section>
  </main>

  <script src="/static/terminal/lib/uplot.iife.min.js"></script>
  <script src="/static/terminal/app.js"></script>
  <script src="/static/terminal/event.js"></script>
</body>
</html>
