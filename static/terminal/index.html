<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="S4K Terminal" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vibepass-storefront-test.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Terminal — Home</title>
  <link rel="stylesheet" href="style.css?v=20260620c" />
</head>
<body data-page="home">

  <header class="topbar">
    <span class="brand">TERMINAL · D0</span>
    <span id="status" class="status">Loading…</span>
  </header>

  <main class="wrap home">
    <section id="watchlist-panel">
      <div class="panel-title row">
        <span>MY WATCHLIST — TRACKED EVENTS</span>
        <span class="muted small" id="watchlistCount"></span>
      </div>
      <div id="watchlistBody"><div class="empty">loading…</div></div>
      <div id="watchlistPager" class="wl-pager" hidden></div>
    </section>

    <section id="coverage-band">
      <div class="panel-title">COVERAGE — ACTIVE FUTURE SPORTS</div>
      <div class="coverage-grid">
        <div class="cv-cell"><span class="cv-num" id="cvTotal">—</span><span class="cv-lbl">tracked</span></div>
        <div class="cv-cell"><span class="cv-num" id="cv30d">—</span><span class="cv-lbl">≤ 30d</span></div>
        <div class="cv-cell"><span class="cv-num" id="cv7d">—</span><span class="cv-lbl">≤ 7d</span></div>
        <div class="cv-cell"><span class="cv-num" id="cvToday">—</span><span class="cv-lbl">today</span></div>
      </div>
    </section>

    <section id="sg-chart">
      <div class="panel-title row">
        <span>TOP 50 — SG SELLING, WE'RE NOT IN</span>
        <span class="muted small" id="sgChartMeta"></span>
      </div>
      <div class="ctrl-group sg-chart-tabs">
        <button class="ctrl-btn is-active" data-chart-tab="top">Top 50</button>
        <button class="ctrl-btn" data-chart-tab="rest">The Rest</button>
      </div>
      <div id="sgChartBody"><div class="empty">loading…</div></div>
    </section>

    <section id="movers-panel">
      <div class="panel-title row">
        <span>MOVERS · CROSS-SOURCE INDEX</span>
        <span class="muted small" id="moversCount"></span>
      </div>
      <div id="moversSummaryStrip" class="muted small" style="margin-bottom:6px"></div>
      <div class="ctrl-row">
        <div class="ctrl-group">
          <span class="ctrl-lbl">SOURCE</span>
          <button class="ctrl-btn is-active" data-src="merged">Merged</button>
          <button class="ctrl-btn"           data-src="evo">EVO</button>
          <button class="ctrl-btn"           data-src="sg">SG</button>
          <button class="ctrl-btn"           data-src="td_sh">SH</button>
          <button class="ctrl-btn"           data-src="td_gt">GT</button>
          <button class="ctrl-btn"           data-src="td_vd">VD</button>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">WINDOW</span>
          <button class="ctrl-btn"           data-wdays="7">7d</button>
          <button class="ctrl-btn"           data-wdays="15">15d</button>
          <button class="ctrl-btn is-active" data-wdays="30">30d</button>
          <button class="ctrl-btn"           data-wdays="180">180d</button>
          <button class="ctrl-btn"           data-wdays="365">365d</button>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">SEGMENT</span>
          <button class="ctrl-btn is-active" data-segment="all">All</button>
          <button class="ctrl-btn"           data-segment="owned">Owned only</button>
        </div>
      </div>
      <div id="moversBody"><div class="empty">loading…</div></div>
    </section>

    <section id="owned-events">
      <div class="panel-title row">
        <span>S4K-OWNED EVENTS — NEXT 30 DAYS</span>
        <span class="muted small" id="ownedEventCount"></span>
      </div>
      <div id="ownedEventsBody"></div>
    </section>
  </main>

  <script src="lib/supabase.js"></script>
  <!-- Cache-busting: first-party JS/CSS carry ?v=<token>. Bump the token (date) on ANY first-party asset change so the static CDN/browser fetch fresh bundles instead of serving a stale cached copy. -->
  <script src="auth.js?v=20260608"></script>
  <script src="app.js?v=20260608"></script>
  <script src="nav.js?v=20260620b"></script>
  <script src="home.js?v=20260620"></script>
</body>
</html>
