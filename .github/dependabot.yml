# Dependabot configuration — version + security updates
#
# Activates when operator enables Dependabot in Settings → Code security
# (currently disabled — see docs/git_repo_security_posture.md G-2).
#
# B1-NEXT-49 / G-19 — file authored 2026-05-17 to be ready when operator
# enables. Until then it sits inert. Re-confirm schedule rhythm with operator
# before enabling — weekly is a reasonable default; daily for high-churn deps.

version: 2
updates:

  # Python dependencies (FastAPI app + clients)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "level:admin"
      - "dependencies"
    reviewers:
      - "JulianS4K"
    commit-message:
      # Prefix is just "chore" — Dependabot auto-appends "(deps)" because of
      # include:scope. Previously prefix:"chore(deps)" + include:scope produced
      # "chore(deps)(deps): ..." which tripped pr-title-lint. Fixed 2026-05-18.
      prefix: "chore"
      include: "scope"
    # Group minor + patch updates per package family — reduces PR noise.
    groups:
      patches:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]
    # Allow security updates outside the group + window.
    allow:
      - dependency-type: "all"
    # Pin majors held by operator 2026-05-18 (B1 triage in PR #239 description).
    # Each entry blocks the version range until the operator explicitly unblocks
    # after smoke-testing the major bump. Security advisories override `ignore`
    # — vulnerable versions still get PRs.
    ignore:
      - dependency-name: "anthropic"
        versions: [">=1.0"]
        # anthropic v1.0 = major API redesign. Hold until anthropic_client.py
        # is audited for v1 compatibility. Original PR #225 closed.

  # GitHub Actions versions (workflow files)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "level:admin"
      - "ci"
    reviewers:
      - "JulianS4K"
    commit-message:
      # See Python prefix note above. Use bare "chore" + include:scope so
      # Dependabot produces "chore(github-actions): ..." cleanly.
      prefix: "chore"
      include: "scope"
    # Pin majors held by operator 2026-05-18 (B1 triage in PR #239 description).
    # Each entry blocks the version range until the operator explicitly unblocks
    # after smoke-testing the major bump.
    ignore:
      - dependency-name: "actions/upload-artifact"
        versions: [">=5"]
        # v5 introduced breaking change: artifacts can no longer be merged
        # automatically. v6 + v7 inherit. Stay on v4 until workflow logic is
        # updated. Original PR #220 closed.
      - dependency-name: "actions/github-script"
        versions: [">=8"]
        # v8 switched to Node 22 + script API changes. Need ecosystem test.
        # Original PR #221 closed.
      - dependency-name: "actions/labeler"
        versions: [">=6"]
        # v6 changed config schema (sync-labels parameter moved). labeler.yml
        # uses v5 syntax. Test before bumping. Original PR #222 closed.
      - dependency-name: "github/codeql-action"
        versions: [">=4"]
        # v4 has migration notes; scorecard.yml uses v3 upload-sarif. Hold
        # until CodeQL workflow is authored (B1-NEXT-4). Original PR #240 closed.

  # Note: Deno (Supabase edge functions) is NOT supported by Dependabot.
  # Edge function deps are pinned via import URLs (e.g.,
  # `https://deno.land/std@0.224.0/`) — B1 manually audits via per-session
  # sweep step 12 (git posture) + secret-scan workflow.
