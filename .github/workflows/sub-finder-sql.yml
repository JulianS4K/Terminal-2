name: sub finder SQL scenarios

# Runs the sub finder's SQL scenario tests (tests/sql/sub_finder) against a
# throwaway Postgres: small stand-ins + the real sub finder migrations, then
# each scenario's output is compared with its expected file. Blocking — a
# migration that changes sub finder behaviour updates the expected output in
# the same PR (tests/sql/sub_finder/run.sh --update).

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/sql/sub_finder/**"
      - ".github/workflows/sub-finder-sql.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/sql/sub_finder/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sub-finder-sql:
    name: sub finder SQL scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Run scenarios
        run: bash tests/sql/sub_finder/run.sh
