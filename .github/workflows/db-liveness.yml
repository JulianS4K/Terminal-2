name: DB liveness alarm

# External liveness check for the Supabase data API, independent of the database itself.
# Runs on GitHub's infrastructure (so it still fires when Postgres / the data API is down),
# needs no secrets (GITHUB_TOKEN is built in; the REST URL and project ref are not secret),
# and pages via a GitHub issue assigned to the operator — who is emailed on creation.
# The issue auto-closes when the API responds again. Operator directive 2026-11-27 after a
# second data-API outage in twelve hours was found by accident (no liveness alarm existed).

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub Actions minimum granularity)
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: db-liveness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase data API
        id: ping
        run: |
          url="https://hzrizjeaxlqcxfrtczpq.supabase.co/rest/v1/"
          # A healthy data API answers 401 (no apikey). Down = no response (000, timeout/refused) or a 5xx.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$url" || echo "000")
          # retry once to avoid a single transient blip paging you
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            sleep 8
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$url" || echo "000")
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi
          echo "data API http=$code -> ${status:-see above}"

      - name: Open / close the outage alert
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.ping.outputs.status }}';
            const code   = '${{ steps.ping.outputs.code }}';
            const label  = 'db-liveness';
            const { owner, repo } = context.repo;
            const now = new Date().toISOString().replace('T',' ').replace(/\..+/,' UTC');
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            const issue = open.data.find(i => !i.pull_request);

            if (status === 'down') {
              if (!issue) {
                await github.rest.issues.create({
                  owner, repo,
                  title: '🔴 Database / data API unreachable',
                  labels: [label],
                  assignees: ['JulianS4K'],
                  body:
                    `The Supabase data API (\`/rest/v1/\`) did not respond (http=${code}) at ${now}.\n\n` +
                    `This alarm checks reachability every ~5 min from GitHub Actions, independent of the ` +
                    `database, and auto-closes when the API responds again.\n\n` +
                    `Run: ${run}\n\ncc @JulianS4K`,
                });
                core.warning(`Data API DOWN (http=${code}) — opened alert issue.`);
              } else {
                core.warning(`Data API still DOWN (http=${code}) — alert issue #${issue.number} already open.`);
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ Data API responding again (http=${code}) at ${now}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
