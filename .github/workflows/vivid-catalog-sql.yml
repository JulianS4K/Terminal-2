name: Vivid catalogue SQL scenarios

# Runs the Vivid Seats catalogue collector + mapper's SQL scenario tests (tests/sql/vivid_catalog) against a
# throwaway Postgres: small stand-ins + the real migration, then each scenario's output is compared with its
# expected file. Blocking — a migration that changes the behaviour updates the expected output in the same PR
# (tests/sql/vivid_catalog/run.sh --update).

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**vivid_catalog**"
      - "tests/sql/vivid_catalog/**"
      - ".github/workflows/vivid-catalog-sql.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**vivid_catalog**"
      - "tests/sql/vivid_catalog/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vivid-catalog-sql:
    name: Vivid catalogue SQL scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Run scenarios
        run: bash tests/sql/vivid_catalog/run.sh
