name: tests

# CI gate — runs on every PR + push to main.
# Jobs: pytest (backend) · typescript (D4 bridge type-check + build) · mypy
#       (Python types) · exos-migrations (apply migrations + run the exos SQL
#       test suite against a real Postgres).
#
# A1 must NOT merge to main until all jobs are green.
# Render auto-deploys on push to main — green CI is the implicit deploy gate.
#
# Added 2026-05-15 (pytest). TypeScript + mypy added 2026-05-26.
# exos-migrations added 2026-06-16 — migrations were never executed in CI, so
# SQL bugs (reserved-word OUT params, column ambiguity, int casts, the voucher
# bypass-at-fulfillment) only surfaced via a local harness. This job runs
# tests/exos/run.sh (apply all migrations + PART A/B assertions) automatically.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN (B1 security review 2026-05-26). CI only reads the
# repo to check out + run tests; no step writes via the token.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          # Tolerate missing requirements.txt early in repo lifecycle.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: RULE 2 read-only static audit
        # Standalone invocation so the audit survives even if the pytest case
        # that shells out to it (test_readonly_guards.py) is ever skipped or
        # deleted. CLAUDE.md §2: this gate is mandatory, no bypass.
        run: python scripts/check_readonly.py

      - name: Run pytest
        env:
          AUTH_DISABLED: "true"
          SUPABASE_URL: "https://example.invalid"
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          # Repo modules (app.py, broadway_client.py, evo_client.py, etc.) live at
          # repo root, not a package. Pytest's rootdir auto-discovery doesn't add
          # them to sys.path; PYTHONPATH=. is the canonical fix.
          PYTHONPATH: "."
        run: pytest tests/ -q --maxfail=1

      - name: mypy type check (warn-only)
        # Informational until the codebase is mypy-clean. Set
        # continue-on-error: false once all type errors are resolved.
        continue-on-error: true
        run: |
          pip install mypy --quiet
          mypy app.py evo_client.py \
            --ignore-missing-imports \
            --no-error-summary \
            --pretty \
            || true
          echo "mypy complete (warn-only)"

  typescript:
    name: TypeScript (D4 bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: d4_bridge
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: d4_bridge/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Build (Vite)
        # Validates no missing imports / dead references. Uses placeholder
        # Supabase keys — the build succeeds without a live connection.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build

  exos-migrations:
    name: exos migration suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Real Postgres so the migrations actually EXECUTE (CI never did this before).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Drives tests/exos/run.sh (it reads PGHOST/PGPORT/PGUSER; psql reads PGPASSWORD).
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Apply migrations + run exos test suite
        # run.sh: create a throwaway DB, load the harness prereq, apply every
        # exos migration in order, then run PART A (each function) + PART B
        # (end-to-end). Any failed migration or ASSERT exits non-zero → red.
        run: bash tests/exos/run.sh exos_ci
