name: tests

# CI gate — runs on every PR + push to main.
# Jobs: pytest (backend) · typescript (D4 bridge type-check + build) · mypy (Python types)
#       · frontend-smoke (Playwright) · exos-sql (Exos SQL migrations + lifecycle)
#
# A1 must NOT merge to main until all jobs are green.
# Render auto-deploys on push to main — green CI is the implicit deploy gate.
#
# Added 2026-05-15 (pytest). TypeScript + mypy added 2026-05-26.
# exos-sql added 2026-07-02 (D4 ticket lifecycle can't regress silently).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN (B1 security review 2026-05-26). CI only reads the
# repo to check out + run tests; no step writes via the token.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov hypothesis
          # Tolerate missing requirements.txt early in repo lifecycle.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: RULE 2 read-only static audit
        # Standalone invocation so the audit survives even if the pytest case
        # that shells out to it (test_readonly_guards.py) is ever skipped or
        # deleted. CLAUDE.md §2: this gate is mandatory, no bypass.
        run: python scripts/check_readonly.py

      - name: Run pytest + coverage gate
        env:
          AUTH_DISABLED: "true"
          SUPABASE_URL: "https://example.invalid"
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          # Dummy TEvo creds so app.py boots in normal (live) mode under
          # coverage's startup module scan instead of sys.exit-ing on missing
          # creds. The lazy TEvo client never makes a real call in tests.
          TEVO_TOKEN: "test-token"
          TEVO_SECRET: "test-secret"
          # Repo modules (app.py, broadway_client.py, evo_client.py, etc.) live at
          # repo root, not a package. Pytest's rootdir auto-discovery doesn't add
          # them to sys.path; PYTHONPATH=. is the canonical fix.
          PYTHONPATH: "."
        # --cov reads the product-code source set from .coveragerc.
        # --cov-fail-under is a RATCHET: it only moves up. Raise it (never lower)
        # as coverage climbs toward the 100% product-code target. Drop maxfail so
        # the coverage report still prints when an assertion fails.
        # --ignore=tests/frontend: the Playwright browser smoke tests run in
        # their own job (frontend-smoke) — they need a browser + run in a
        # separate process (Playwright's sync API event loop conflicts with the
        # backend suite's anyio.run handler tests). They're omitted from the
        # coverage surface anyway (.coveragerc omits tests/*).
        # --ignore=tests/rls: needs a live migrated Postgres (supabase-rls
        # workflow). --ignore=tests/deploy_smoke: drives the DEPLOYED preview
        # (post-deploy workflow), not the in-process app. Neither is part of
        # this DB-less job's coverage surface.
        run: pytest tests/ --ignore=tests/frontend --ignore=tests/rls --ignore=tests/deploy_smoke -q --cov --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100

      - name: install mypy
        run: pip install mypy types-requests --quiet

      # ── Ratchet foothold (BLOCKING) ──────────────────────────────────────
      # These modules are mypy-clean today and must stay that way. A new type
      # error here fails CI. Grow MYPY_STRICT_PATHS as more modules are cleaned
      # (server.py=66 errs, core/ ~20 errs remain → still warn-only below).
      # Ends the prior "green-by-definition" state for the audited surface.
      - name: mypy type check (blocking — clean modules)
        # Ratchet expanded to most of core/ (coding-recommendation #5: strict on
        # core/ first — it's small + security-critical). Includes the rate
        # limiter, circuit breaker, and vault. The 8 modules still carrying type
        # errors (search/movers/discovery/db/store_events/ingest/auth/
        # trip_payloads) stay in the warn-only pass below until cleaned; move
        # each here as it reaches zero errors. Never move a file OUT of here.
        env:
          MYPY_STRICT_PATHS: >-
            core/config.py
            core/http_retry.py
            core/readonly_guard.py
            core/__init__.py
            core/broker_helpers.py
            core/canonical_refresh.py
            core/helpers.py
            core/observability.py
            core/ratelimit.py
            core/resilience.py
            core/substitutions.py
            core/vault.py
            routers/__init__.py
        run: |
          mypy $MYPY_STRICT_PATHS --ignore-missing-imports --pretty
          echo "mypy strict foothold clean"

      # Broad informational pass over the not-yet-clean surface. Move files
      # from here into MYPY_STRICT_PATHS above as they reach zero errors.
      - name: mypy type check (warn-only)
        continue-on-error: true
        run: |
          mypy server.py evo_client.py \
            core/search.py core/movers.py core/discovery.py core/db.py \
            core/store_events.py core/ingest.py core/auth.py core/trip_payloads.py \
            --ignore-missing-imports \
            --no-error-summary \
            --pretty \
            || true
          echo "mypy complete (warn-only)"

  typescript:
    name: TypeScript (D4 bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: d4_bridge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: d4_bridge/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Build (Vite)
        # Validates no missing imports / dead references. Uses placeholder
        # Supabase keys — the build succeeds without a live connection.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build

  frontend-smoke:
    name: Frontend smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Chromium for Playwright
        # CI has no pre-provisioned browser, so fetch one here (the dev
        # container's /opt/pw-browsers path doesn't exist on the runner; the
        # browser fixture falls back to Playwright's default browser when the
        # pre-installed build is absent).
        run: python -m playwright install --with-deps chromium

      - name: Run frontend smoke tests
        # Boots the real FastAPI app in a background thread (demo mode — no
        # creds) and drives Chromium over each shipped page. Regression net for
        # the BR-CODE-4 JS/CSS dedup.
        env:
          PYTHONPATH: "."
        run: pytest tests/frontend -q

  exos-sql:
    name: Exos SQL (migrations + lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Applies the D4 Exos migrations against a throwaway Postgres and runs the
    # SQL regression suites: the phase-3 platform test (tests/exos/run.sh) and
    # the ticket LIFECYCLE test (tests/exos/run_lifecycle.sh) — mint → offline
    # roster → HMAC door scan → transfer/claim/reissue → void — which drives the
    # REAL migrated RPC bodies so those semantics can't regress silently.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5433"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Exos platform suite (waitlist/addons/vouchers/tax/invoicing)
        run: bash tests/exos/run.sh exos_test

      - name: Exos ticket-lifecycle suite (mint/scan/transfer/void/reissue)
        run: bash tests/exos/run_lifecycle.sh exos_lifecycle_test
