name: ProVenue watch SQL scenarios

# Runs the ProVenue watch's SQL scenario tests (tests/sql/provenue_watch) against a throwaway Postgres: the AXS watch's
# test database (tests/sql/axs_watch/build.sh) + the ProVenue watch migration, then each scenario's output is compared with its
# expected file. Blocking — a migration that changes the behaviour updates the expected output in the same PR
# (tests/sql/provenue_watch/run.sh --update).

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**axs_watch**"
      - "supabase/migrations/**primary_poll**"
      - "supabase/migrations/**provenue_watch**"
      - "tests/sql/provenue_watch/**"
      - "tests/sql/axs_watch/build.sh"
      - "tests/sql/axs_watch/stub_*.sql"
      - ".github/workflows/provenue-watch-sql.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**axs_watch**"
      - "supabase/migrations/**primary_poll**"
      - "supabase/migrations/**provenue_watch**"
      - "tests/sql/provenue_watch/**"
      - "tests/sql/axs_watch/build.sh"
      - "tests/sql/axs_watch/stub_*.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenue-watch-sql:
    name: ProVenue watch SQL scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Run scenarios
        run: bash tests/sql/provenue_watch/run.sh
