name: AXS export SQL scenarios

# Runs the AXS export feed's SQL scenario tests (tests/sql/axs_export) against a throwaway Postgres: the AXS watch
# stand-ins (pg_net, the vault helper, safe_jsonb, the TicketsData credit ledger, axs_export_event) + axs_export_sync
# as it stands before the cursor migration + the real export migrations, then each scenario's output is compared with
# its expected file. Blocking — a migration that changes the behaviour updates the expected output in the same PR
# (tests/sql/axs_export/run.sh --update).
#
# The suite reuses tests/sql/axs_watch/stub_00_base.sql, so a change to that stub runs this job too.

on:
  pull_request:
    branches: [main]
    paths:
      # Any migration, not a filename pattern -- see axs-watch-sql.yml for the full
      # account. Proven here too: 20261127020000_opry_house_joins_the_venues.sql adds a
      # venue to axs_export_event, which is exactly this suite's subject, and its name
      # contains no "axs_export", so this BLOCKING gate skipped it.
      - "supabase/migrations/**"
      - "tests/sql/axs_export/**"
      - "tests/sql/axs_watch/stub_00_base.sql"
      - ".github/workflows/axs-export-sql.yml"
  push:
    branches: [main]
    paths:
      # same reason as the pull_request filter above
      - "supabase/migrations/**"
      - "tests/sql/axs_export/**"
      - "tests/sql/axs_watch/stub_00_base.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axs-export-sql:
    name: AXS export SQL scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Run scenarios
        run: bash tests/sql/axs_export/run.sh
