name: permission-exceptions

# Enforces the PROJECT_BIBLE §2.2 permission-exceptions ledger
# (.github/permission-exceptions.yml). Unlike seam-review (a non-blocking
# nudge), this job is BLOCKING by design — that is the whole point: an
# exception whose `review_by` date has passed, or an entry that is malformed,
# FAILS the build, so a privilege grant can't quietly outlive its review. Renew
# it (re-approve + bump the date) or delete it. Empty ledger = trivially green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check the permission-exceptions ledger
        run: python scripts/check_permission_exceptions.py
