name: sync-check

# Runs bin/sync-check.sh on every push to main + nightly. If drift is detected,
# opens (or updates) a GitHub issue with the report.
#
# REQUIRES these GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 https://hzrizjeaxlqcxfrtczpq.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    eyJ...  (Supabase dashboard → Project Settings → API → service_role key)
#   SUPABASE_PAT                 sbp_... (optional; enables edge-fn diff. Supabase dashboard → Account → Tokens)
#
# Without SUPABASE_PAT, only migration drift is checked (covers ~80% of historical drift cases).

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily (off-peak; avoid round-hour cron stampede)
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: read
  issues: write             # for the auto-open-issue-on-drift step

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync-check
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          chmod +x bin/sync-check.sh
          set +e
          bin/sync-check.sh --report-md sync-check-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-check-report
          path: sync-check-report.md
          retention-days: 30

      - name: Open or update issue on drift
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sync-check-report.md', 'utf8');
            const title = '⚠️ sync-check: drift detected';
            // Search for an existing open drift issue (auto-created previously)
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-check',
            });
            const dup = (existing.data || []).find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                body: `Drift detected on ${{ github.event_name }} at ${{ github.sha }}\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
                labels: ['sync-check'],
              });
            }

      - name: Close drift issue if clean
        if: steps.check.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-check',
            });
            const dup = (existing.data || []).find(i => i.title === '⚠️ sync-check: drift detected');
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                body: `Drift cleared as of ${{ github.sha }}. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                state: 'closed',
              });
            }
