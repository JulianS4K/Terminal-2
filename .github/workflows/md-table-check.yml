name: md-table-check

# Markdown table-structure gate for the canonical governance docs.
#
# Closes a real gap: the docs-registry gate validates the registry + version
# headers but NOT table well-formedness, so a stray missing newline that mashed
# two KANBAN rows onto one line (and a separate row with a raw `|`) both merged
# unnoticed. This job fails the build when a table body row's column count does
# not match its header — the mashed-row / stray-pipe failure mode.
#
# BLOCKING by design (like docs-registry): a corrupted governance table should
# not reach main. Pure stdlib — no dependencies to install.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check markdown table structure
        run: python scripts/check_md_tables.py
