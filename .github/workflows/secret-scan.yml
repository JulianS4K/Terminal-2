name: secret-scan

# Gitleaks-based secret scanning. Runs on every PR, weekly on main, and on
# manual dispatch. Failures block PR merge and open an issue on weekly runs.
#
# History:
# - 2026-05-11: `CRON_SECRET` leaked in chat → rotated. KANBAN.md SECURITY BACKLOG.
# - 2026-05-14: `APPSCRIPT_INGEST_SECRET` exposure incident → rotated.
# - 2026-05-15: this workflow added by B1 to catch similar incidents pre-merge.
#
# Allowlisted values (configured in .gitleaksignore at repo root):
# - The Supabase anon JWT (semi-public per Supabase model — exposed in /api/public/config)
# - The public Supabase URL (https://hzrizjeaxlqcxfrtczpq.supabase.co)
# - Placeholder / example tokens in docs (e.g. "CHANGE_ME_BEFORE_HANDOFF")
#
# REQUIRES no external secrets — gitleaks is self-contained.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'    # Mondays 05:23 UTC (off-peak; weekly full-history scan)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write       # for PR comment on findings
  issues: write              # for weekly-run auto-issue on findings

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history for accurate scan

      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: '@JulianS4K'
        continue-on-error: true

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🚨 secret-scan: gitleaks detected a potential secret',
              '',
              'Gitleaks flagged one or more potential secrets in this PR. Possible causes:',
              '- An actual leaked credential (rotate immediately + redact from history)',
              '- A test fixture or example value (add to `.gitleaksignore`)',
              '- A placeholder string (add to `.gitleaksignore`)',
              '',
              'Action required from PR author:',
              '1. Review the gitleaks output in the Actions tab.',
              '2. If a real secret leaked: stop, rotate the credential via vault, then redact and force-push (operator-coordinated).',
              '3. If a false positive: add the value to `.gitleaksignore` with a comment explaining why.',
              '',
              'B1 is auto-tagged for review. Block merge until resolved.',
              '',
              '_Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Open or update issue on weekly drift
        if: github.event_name == 'schedule' && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 secret-scan (weekly): gitleaks finding on main';
            const body = [
              'Weekly full-history gitleaks scan on `main` flagged a finding.',
              '',
              'See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              '',
              'B1 to triage per `docs/b1_operating_constraints.md` severity matrix:',
              '- SEC-CRIT if exploitable today → rotate + redact + force-push (operator-coordinated)',
              '- SEC-MED if false positive → add to `.gitleaksignore`',
              '- SEC-LOW if placeholder/example → add to `.gitleaksignore`',
              '',
              'Run id: ${{ github.run_id }}'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secret-scan'
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['secret-scan', 'security']
              });
            }

      - name: Fail workflow if findings present
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1
