name: bible-freshness

# Forces a doc update in the SAME PR as a change the bibles describe (RULE 0 /
# same-PR doc discipline). Runs bin/check-bible-freshness.sh on PRs touching a
# doc-bearing path. A non-zero exit FAILS the check and blocks the merge —
# server-side, --no-verify cannot skip it. Escape hatch: a `BIBLE-OK: <reason>`
# line in any commit message in the PR (for legit no-doc changes).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**.sql'
      - '**_client.py'
      - 'supabase/functions/**'
      - 'render*.yaml'
      - 'render*.yml'
      - 'bin/check-bible-freshness.sh'
      - '.github/workflows/bible-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bible-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need history to diff against the PR base

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Check bible freshness
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x bin/check-bible-freshness.sh
          bin/check-bible-freshness.sh --base "origin/$BASE_REF"
