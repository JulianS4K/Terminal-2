name: AXS watch SQL scenarios

# Runs the AXS watch's SQL scenario tests (tests/sql/axs_watch) against a throwaway Postgres: small stand-ins + the
# real box-office poll migrations + the AXS watch migration, then each scenario's output is compared with its
# expected file. Blocking — a migration that changes the behaviour updates the expected output in the same PR
# (tests/sql/axs_watch/run.sh --update).

on:
  pull_request:
    branches: [main]
    paths:
      # Any migration, not a filename pattern. The two globs that used to stand here
      # ("**axs_watch**", "**primary_poll**") matched a migration's NAME, and a name is
      # prose: every AXS watch migration of 2026-11-26/27 (freshness_follows_the_band,
      # zero_listings_is_sold_out, thin_inventory_is_preemptive_sold_out,
      # parked_reads_outside_the_cap, orphaned_claims_clear_in_five_minutes,
      # parked_reads_counted_where_they_were_released) changed this suite's subject and
      # matched neither glob, so the gate this comment block calls BLOCKING never ran on
      # any of them. A directory is a fact; a filename is a promise. Breadth is the price.
      - "supabase/migrations/**"
      - "tests/sql/axs_watch/**"
      - ".github/workflows/axs-watch-sql.yml"
  push:
    branches: [main]
    paths:
      # same reason as the pull_request filter above: a filename is not a fact
      - "supabase/migrations/**"
      - "tests/sql/axs_watch/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axs-watch-sql:
    name: AXS watch SQL scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Run scenarios
        run: bash tests/sql/axs_watch/run.sh
