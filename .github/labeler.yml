# Path-based PR labeler config — pairs with .github/workflows/labeler.yml
#
# When a PR touches files matching a pattern, the listed labels are applied.
# Branch-prefix labeling (a1/* → level:admin) is handled in workflows/labeler.yml.

"area:migrations":
  - changed-files:
      - any-glob-to-any-file: "supabase/migrations/**/*.sql"

"area:edge-functions":
  - changed-files:
      - any-glob-to-any-file: "supabase/functions/**/*"

"area:backend":
  - changed-files:
      - any-glob-to-any-file:
          - "app.py"
          - "*_client.py"
          - "requirements.txt"
          - "Procfile"

"area:terminal-fe":
  - changed-files:
      - any-glob-to-any-file: "static/terminal/**/*"

"area:storefront":
  - changed-files:
      - any-glob-to-any-file: "static/store/**/*"

"area:dashboard":
  - changed-files:
      - any-glob-to-any-file: "d2_dashboard/**/*"

# D4 / The Bridge (Exos primary-ticketing). Matches ONLY exos-prefixed
# functions + *exos* migrations, never a bare "*bridge*" glob — several
# non-D4 migrations/functions (sg_to_tevo_search_bridge, espn_bridge,
# aq-to-tevo-search-bridge, venue_alias_bridge) carry "bridge" in the name
# but belong to the A1/D0 cross-source lanes, not D4.
"area:bridge":
  - changed-files:
      - any-glob-to-any-file:
          - "d4_bridge/**/*"
          - "static/bridge/**/*"
          - "supabase/functions/exos-*/**/*"
          - "supabase/migrations/*exos*.sql"
          - "docs/d4_*"

# D6 — Paciolan/eVenue primary box-office ingest (browser-extension-sourced).
# paciolan_client normalizer, the Chrome collector, the /api/paciolan route
# block, and the paciolan_* schema. RULE-2 lockdown of evenue.net is A1/B1
# policy over this surface (PROJECT_BIBLE §2.3).
"area:d6":
  - changed-files:
      - any-glob-to-any-file:
          - "paciolan_client.py"
          - "paciolan_extension/**/*"
          - "routers/paciolan.py"
          - "supabase/migrations/*paciolan*.sql"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*.md"
          - "*.md"

"area:bibles":
  - changed-files:
      - any-glob-to-any-file:
          - "PROJECT_BIBLE.md"
          - "RESOURCES_BIBLE.md"
          - "CLAUDE.md"
          - "BOT_HIERARCHY.md"
          - "LANE_DISCIPLINE.md"
          - "MIGRATION_CONVENTIONS.md"
          - "SYNC_PROTOCOL.md"
          - "SCHEMA.md"
          - "CRON_HIERARCHY.md"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"
          - ".github/CODEOWNERS"
          - "scripts/**/*"
          - "bin/**/*"

"area:tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"area:design":
  - changed-files:
      - any-glob-to-any-file: "design/**/*"

"area:kanban":
  - changed-files:
      - any-glob-to-any-file: "KANBAN.md"

# ── Orphan-closure labels (2026-06-19) — every surface is now labeled so a
# cross-lane touch is visible on the PR (BOT_HIERARCHY §5.5 no-orphan invariant).

# D0-owned hub + placeholder static surfaces (not the terminal app itself).
"area:hub-fe":
  - changed-files:
      - any-glob-to-any-file:
          - "static/home/**/*"
          - "static/undelivered/**/*"
          - "static/index.html"
          - "static/favicon.svg"
          - "static/version.json"

# Shared FE assets that ripple across every surface — touching these is a
# cross-lane change by definition (the seam-review job flags it; PROJECT_BIBLE §2.6).
"area:shared-fe":
  - changed-files:
      - any-glob-to-any-file:
          - "static/_shared/**/*"
          - "static/shared/**/*"

# Retail-chat cross-surface feature (#583): widget + edge fn consumed by BOTH
# terminal (D0) and store (D1). The label flags a cross-lane seam (§5.5b).
"area:retail-chat":
  - changed-files:
      - any-glob-to-any-file:
          - "static/shared/retail-chat-widget.js"
          - "static/terminal/retail-chat.*"
          - "static/store/chat.html"
          - "supabase/functions/chat/**/*"

# D3 Broadway scraper.
"area:broadway":
  - changed-files:
      - any-glob-to-any-file:
          - "broadway_client.py"
          - "broadway_extension/**/*"

# Shared trip-planner engine (D0 + D1 routes, §5.5b).
"area:trip-planner":
  - changed-files:
      - any-glob-to-any-file: "trip_planner/**/*"
