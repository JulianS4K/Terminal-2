# Terminal-2 gitleaks configuration.
#
# Extends gitleaks' full default ruleset (no detection weakened) and adds a
# single scoped allowlist for the generated Understand-Anything analysis
# outputs under .understand-anything/.
#
# Why this path is exempt:
#   The knowledge graph + interactive chart are tree-sitter/LLM-derived
#   artifacts that contain ONLY source identifiers — file paths, function and
#   class names, doc titles. Some of those names coincidentally match secret
#   regexes (e.g. the test function `test_discover_against_fastly_403` trips
#   the `fastly-api-token` rule). These are never credentials, and the
#   directory is generated/regenerable, so line-pinned fingerprints would be
#   brittle across regenerations. Scoping the allowlist to this one generated
#   directory keeps full secret detection everywhere real code lives.
#
# Owner: B1 (Security Manager). Added 2026-06-09 under operator directive to
# version the code knowledge-graph chart. Do NOT broaden this allowlist.
#
# 2026-07-02: added a tightly-scoped regex allowlist for the project's public
# Supabase ANON JWT (see [allowlist].regexes below). This is NOT a broadening
# of detection — it whitelists one known-public value (the anon publishable
# key, already documented semi-public in .gitleaksignore and secret-scan.yml).
# It complements the per-file `jwt` fingerprints in .gitleaksignore: the regex
# is content-anchored, so it stays honored when the same anon key reappears in
# a NEW file/line (e.g. a fresh Vite bundle hash) that no fingerprint yet pins.
# A service_role token encodes a different payload and remains fully detected.
# (Re-applies the surviving value of PR #562 / issue #242 onto current main;
# the 3 generic-api-key false positives that PR also listed are already covered
# by the 2026-06-21 global-fingerprint triage in .gitleaksignore.)

title = "Terminal-2 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated Understand-Anything artifacts + public Supabase anon JWT (source identifiers / known-public values only, no secrets)."
paths = [
  '''\.understand-anything/''',
]
# Anchored on the base64url of {"iss":"supabase","ref":"hzrizjeaxlqcxfrtczpq",
# "role":"anon" — i.e. ONLY this project's anon-role JWTs. Supabase emits a
# fixed JSON key order, so this prefix is deterministic across key rotations
# (iat/exp differ) and across Vite rebuilds (bridge bundles get new filenames).
# service_role / any other role encodes a different payload and is NOT matched.
regexes = [
  '''eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6cml6amVheGxxY3hmcnRjenBxIiwicm9sZSI6ImFub24i''',
]
