# ⚠️ RETIREMENT-BOUND (2026-07-10) — DO NOT provision/revive this service.
# The D2 lane was MERGED INTO D0 on 2026-07-02 (PROJECT_BIBLE §2.3): the orders
# dashboard is a D0 sub-surface, served SAME-ORIGIN with the D0 terminal from the
# D0 deploy (its `/api/d2/*` routes are fronted by `routers/d0_orders.py`). This
# standalone `d2-orders-dashboard` service is an idle placeholder; reviving it as
# its own service would re-create the D2/D0 split the merge dissolved. Slated for
# deletion once the routes finish consolidating into D0's own deploy (a Render
# write = Applier action, §2.1). Kept here only as a historical record until then.
# See docs/archive/2026-07-10-code-storage-blueprint.md §4 step 1.
#
# Render.com Infrastructure-as-Code blueprint for D2's orders dashboard.
#
# OWNER: D0 (orders dashboard, ex-D2 — folded into D0 2026-07-02). Historically
# D2 (PRs #104 + #105, 2026-05-14) before the lane merge.
# Service: d2-orders-dashboard (srv-d82b4kl7vvec73b4r3r0)
# Companion blueprint for D1's storefront: render.yaml
#
# This file mirrors the existing service config that was created manually
# via dashboard on 2026-05-13. It exists so D2's bot can manage IaC for
# this service in version control rather than dashboard-only edits.
#
# To apply changes from this blueprint to the live service:
#   - Edit this file in a PR
#   - On merge to main, Render reconciles changes if the blueprint is
#     connected (currently service was dashboard-created; connecting the
#     blueprint requires one-time operator action in the dashboard)
#
# Until the blueprint is wired in, this file is documentation-only.
#
# Env shape rationale: the dashboard is SQL-only (no broker-API calls in
# the data path). Supabase reads are the data path; everything else is
# either auth-related or optional. Broker tokens (TEVO/SG/TickPick/Vivid/
# SeatData) are NOT listed here — the dashboard doesn't read from them
# during /api/d2/orders. They can be left in the Render dashboard if
# desired (the `_broker_diag` env introspection in /healthz/detail will
# report them as set/unset, but no order endpoint consumes them).

services:
  - type: web
    name: d2-orders-dashboard
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn d2_dashboard.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Hard-required: SQL reads against unified_orders + raw *_orders
      # tables + v_event_base. Without these, /api/d2/orders returns 503.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Auth gate (only consulted when AUTH_DISABLED=false, which is the
      # shipped prod default per d2_dashboard/DEPLOY.md).
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: s4kent.com
      - key: D2_CANONICAL_ORIGIN
        value: https://d2-orders-dashboard.onrender.com

      # GoTickets — the one source without SQL backing (no list endpoint
      # upstream, no ingest cron yet). Required only if the operator uses
      # the by-id form on the Samples tab; safe to omit.
      - key: GOTICKETS_ACCESS_ID
        sync: false
      - key: GOTICKETS_API_SECRET
        sync: false
      - key: GOTICKETS_SAMPLE_ORDER_ID
        sync: false
