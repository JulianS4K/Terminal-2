<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; }
    input[type=text], input[type=url] { width: 100%; box-sizing: border-box; padding: 5px; }
    .row { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
    button { padding: 6px 10px; cursor: pointer; }
    #status { margin: 8px 0; padding: 6px; background: #f2f2f2; border-radius: 4px; }
    #recent { max-height: 160px; overflow: auto; border-top: 1px solid #ddd; margin-top: 8px; padding-top: 6px; }
    .cap { font-size: 12px; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <h1>eVenue / Paciolan Seat Collector</h1>

  <label>Ingest URL</label>
  <input id="ingestUrl" type="url" placeholder="https://your-app/api/paciolan/ingest" />

  <label>Ingest secret (X-Ingest-Secret)</label>
  <input id="ingestSecret" type="text" placeholder="shared secret (never service_role)" />

  <div class="row">
    <input id="enabled" type="checkbox" /><label for="enabled" style="margin:0">Ship captures</label>
  </div>

  <div class="row">
    <button id="save">Save</button>
    <button id="recapture">Capture now</button>
    <button id="export">Export JSON</button>
  </div>

  <div id="status" class="muted">Local-only until enabled.</div>
  <div id="recent"></div>

  <script src="popup.js"></script>
</body>
</html>
