<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undelivered · fulfillment + sales tracking</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="/static/d2/dashboard.css" />
</head>
<body>

<div id="app-root">
  <div class="empty"><span class="spinner"></span> bootstrapping...</div>
</div>

<script id="d2-config" type="application/json">__D2_CONFIG_JSON__</script>
<script>
  // Hydrate the server-rendered config blob onto window before the module
  // controller loads. JSON is parsed (not eval'd) so injected values cannot
  // execute even if a future config field accidentally contains markup.
  try {
    const el = document.getElementById("d2-config");
    window.__D2_CONFIG__ = JSON.parse(el.textContent);
  } catch (e) {
    window.__D2_CONFIG__ = {};
    console.error("D2 config parse failed:", e);
  }
</script>
<script type="module" src="/static/d2/dashboard.js"></script>

</body>
</html>
