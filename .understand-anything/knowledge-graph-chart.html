<style>

  *{box-sizing:border-box}

  #app{position:fixed;inset:0}
  canvas{display:block;position:absolute;inset:0;cursor:grab}

  .top{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(22,27,34,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);z-index:5}
  .top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.3px}
  .top h1 small{color:var(--muted);font-weight:400}
  .top .stats{color:var(--muted);font-size:12px}
  .top .spacer{flex:1}
  #search{background:#0d1117;border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:6px 10px;width:230px;font-size:12px}
  .top label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .legend{position:absolute;top:62px;left:12px;width:252px;max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;z-index:5}
  .legend h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:2px 4px 8px}
  .lrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
  .lrow:hover{background:#1f2630}
  .lrow.off{opacity:.35}
  .sw{width:12px;height:12px;border-radius:3px;flex:none}
  .lrow .nm{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .ct{color:var(--muted);font-size:11px}
  .panel{position:absolute;top:62px;right:12px;width:330px;max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;z-index:6;display:none}
  .panel.show{display:block}
  .panel .ptype{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:20px;background:#222b36;color:var(--accent);margin-bottom:8px}
  .panel h3{margin:0 0 4px;font-size:15px;word-break:break-word}
  .panel .path{color:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin-bottom:10px}
  .panel .lay{font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .panel .sum{font-size:13px;color:#c9d1d9;margin:8px 0}
  .panel .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .panel .tag{font-size:11px;background:#1f2630;border:1px solid var(--border);border-radius:20px;padding:2px 8px;color:var(--muted)}
  .panel .close{float:right;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
  .tour{position:absolute;bottom:12px;left:12px;width:252px;background:var(--panel);border:1px solid var(--border);border-radius:10px;z-index:5;max-height:44%;display:flex;flex-direction:column}
  .tour h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:10px 12px 6px;cursor:pointer;display:flex;justify-content:space-between}
  .tour .body{overflow:auto;padding:0 6px 8px}
  .tstep{padding:7px 8px;border-radius:6px;cursor:pointer}
  .tstep:hover{background:#1f2630}
  .tstep .tt{font-size:12px;font-weight:600}
  .tstep .td{font-size:11px;color:var(--muted);margin-top:3px;display:none}
  .tstep.open .td{display:block}
  .hint{position:absolute;bottom:12px;right:12px;color:var(--muted);font-size:11px;background:rgba(22,27,34,.8);padding:6px 10px;border-radius:6px;z-index:5}
  #tip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;z-index:9;display:none;max-width:300px}
</style>

[1829,1821,\"imports\"],[1834,1725,\"imports\"]],\"tour\":[{\"o\":1,\"t\":\"Project Overview & Governance\",\"d\":\"Start with the README and the operator/governance bibles that every bot reads at session start — they define the platform, the lane model, and the read-only lockdown rules.\",\"ids\":[\"document:README.md\",\"document:CLAUDE.md\",\"document:PROJECT_BIBLE.md\"]},{\"o\":2,\"t\":\"Backend Entry Point\",\"d\":\"app.py is the FastAPI application — it mounts the D0/D1/D2 surfaces and exposes the storefront, terminal, webhook, and metrics endpoints.\",\"ids\":[\"file:app.py\"]},{\"o\":3,\"t\":\"Upstream Source Clients\",\"d\":\"Read-only clients ingest market data from each listing source. By construction they are GET-only (ALLOWED_HTTP_METHODS + _assert_readonly_method), so price/inventory can never be mutated.\",\"ids\":[\"file:seatgeek_client.py\",\"file:evo_client.py\",\"file:tickpick_client.py\",\"file:vivid_client.py\"]},{\"o\":4,\"t\":\"The Data Model\",\"d\":\"The Supabase Postgres schema is built up through hundreds of timestamped migrations — starting from the init migration that defines events, snapshots, and watchlists.\",\"ids\":[\"table:supabase/migrations/20260423000000_init.sql\"]},{\"o\":5,\"t\":\"Edge Functions\",\"d\":\"Deno/TypeScript edge functions handle cron auth, mail drains, seller webhooks, and chat — the serverless glue around the database.\",\"ids\":[\"file:supabase/functions/_shared/cron-auth.ts\"]},{\"o\":6,\"t\":\"D0 Terminal Frontend\",\"d\":\"The trader-facing terminal: discovery, event, and performer views that visualize the ingested market intelligence.\",\"ids\":[\"file:static/terminal/discovery.html\"]},{\"o\":7,\"t\":\"D1 Storefront\",\"d\":\"The consumer retail storefront surfaces (discover/event/about) plus its test sandbox.\",\"ids\":[\"file:static/store/about.html\"]},{\"o\":8,\"t\":\"D4 Ticket Bridge\",\"d\":\"The consumer claim/transfer/wallet-pass app — React/TypeScript source in d4_bridge, shipped as built bundles <script>
const DATA = JSON.parse(JSON.parse(document.getElementById("data").textContent));
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const N=DATA.nodes, Edg=DATA.edges, Layers=DATA.layers;
const layerById={}; Layers.forEach(l=>layerById[l.id]=l);
const colorOf=id=>(layerById[id]&&layerById[id].color)||"#777";
const SIZE={file:4,function:2.2,class:3,table:2.4,document:2.6,config:3,service:4.5,pipeline:3.4,schema:3,resource:3,endpoint:3};
const isFn=t=>t==="function"||t==="class";
const hidden={};
let showFns=false, showEdges=true, query="";
let scale=0.5, tx=0, ty=0, DPR=1;
function fit(){
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const n of N){ if(n.x<minx)minx=n.x; if(n.y<miny)miny=n.y; if(n.x>maxx)maxx=n.x; if(n.y>maxy)maxy=n.y; }
  const w=cv.clientWidth,h=cv.clientHeight,gw=(maxx-minx)||1,gh=(maxy-miny)||1;
  scale=Math.min(w/(gw+240), h/(gh+240))*0.95;
  tx=w/2-(minx+maxx)/2*scale; ty=h/2-(miny+maxy)/2*scale;
}
const visible=n=> !hidden[n.l] && (showFns || !isFn(n.t));
function resize(){ DPR=window.devicePixelRatio||1; cv.width=cv.clientWidth*DPR; cv.height=cv.clientHeight*DPR; draw(); }
let hlNode=null, selNode=null;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  ctx.save(); ctx.translate(tx,ty); ctx.scale(scale,scale);
  if(showEdges && scale>0.1){
    ctx.lineWidth=0.6/scale;
    for(const e of Edg){
      const a=N[e[0]], b=N[e[1]]; if(!visible(a)||!visible(b))continue;
      const conn = hlNode&&(a===hlNode||b===hlNode);
      ctx.strokeStyle = conn?"rgba(79,140,255,0.55)":"rgba(140,150,165,0.09)";
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }
  const q=query.toLowerCase();
  for(const n of N){
    if(!visible(n))continue;
    const r=SIZE[n.t]||3;
    const match=q&&(n.n.toLowerCase().includes(q)||n.p.toLowerCase().includes(q)||(n.g||"").toLowerCase().includes(q));
    ctx.globalAlpha=q?(match?1:0.1):1;
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,6.283); ctx.fillStyle=colorOf(n.l); ctx.fill();
    if(match){ ctx.globalAlpha=1; ctx.lineWidth=1.4/scale; ctx.strokeStyle="#fff"; ctx.stroke(); }
  }
  ctx.globalAlpha=1;
  if(hlNode&&visible(hlNode)){ const r=(SIZE[hlNode.t]||3)+2.5/scale; ctx.beginPath(); ctx.arc(hlNode.x,hlNode.y,r,0,6.283); ctx.lineWidth=1.6/scale; ctx.strokeStyle="#fff"; ctx.stroke(); }
  if(selNode){ const r=(SIZE[selNode.t]||3)+4/scale; ctx.beginPath(); ctx.arc(selNode.x,selNode.y,r,0,6.283); ctx.lineWidth=2.2/scale; ctx.strokeStyle="#4f8cff"; ctx.stroke(); }
  ctx.restore();
}
const worldFromScreen=(sx,sy)=>({x:(sx-tx)/scale,y:(sy-ty)/scale});
function pick(sx,sy){
  const w=worldFromScreen(sx,sy); let best=null,bd=1e9;
  for(const n of N){ if(!visible(n))continue; const dx=n.x-w.x,dy=n.y-w.y,d=dx*dx+dy*dy,rr=(SIZE[n.t]||3)+5/scale; if(d<rr*rr&&d<bd){bd=d;best=n;} }
  return best;
}
const tip=document.getElementById("tip");
let dragging=false,lx=0,ly=0,downx=0,downy=0;
cv.addEventListener("mousedown",ev=>{dragging=true;lx=ev.clientX;ly=ev.clientY;downx=ev.clientX;downy=ev.clientY;cv.classList.add("drag");});
cv.addEventListener("mousemove",ev=>{
  if(dragging){ tx+=ev.clientX-lx; ty+=ev.clientY-ly; lx=ev.clientX; ly=ev.clientY; draw(); return; }
  const n=pick(ev.clientX,ev.clientY); hlNode=n;
  if(n){ tip.style.display="block"; tip.style.left=(ev.clientX+12)+"px"; tip.style.top=(ev.clientY+12)+"px"; tip.innerHTML="<b>"+esc(n.n)+"</b> <span style='color:#8b949e'>"+n.t+"</span>"; }
  else tip.style.display="none";
  draw();
});
window.addEventListener("mouseup",ev=>{
  if(dragging){ const md=Math.abs(ev.clientX-downx)>4||Math.abs(ev.clientY-downy)>4; if(!md){ const n=pick(ev.clientX,ev.clientY); n?select(n):hidePanel(); } }
  dragging=false; cv.classList.remove("drag");
});
cv.addEventListener("wheel",ev=>{ ev.preventDefault(); const f=Math.exp(-ev.deltaY*0.0012),mx=ev.clientX,my=ev.clientY,wx=(mx-tx)/scale,wy=(my-ty)/scale; scale=Math.max(0.04,Math.min(8,scale*f)); tx=mx-wx*scale; ty=my-wy*scale; draw(); },{passive:false});
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const panel=document.getElementById("panel");
function select(n){
  selNode=n; const lay=layerById[n.l];
  panel.innerHTML='<span class="close" onclick="hidePanel()">&times;</span>'
    +'<span class="ptype">'+esc(n.t)+'</span><h3>'+esc(n.n)+'</h3>'
    +(n.p?'<div class="path">'+esc(n.p)+'</div>':'')
    +(lay?'<div class="lay"><span class="sw" style="background:'+lay.color+'"></span>'+esc(lay.name)+'</div>':'')
    +'<div class="sum">'+esc(n.s||"—")+'</div>'
    +(n.g?'<div class="tags">'+n.g.split(", ").filter(Boolean).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>':'');
  panel.classList.add("show"); draw();
}
function hidePanel(){ panel.classList.remove("show"); selNode=null; draw(); }
window.hidePanel=hidePanel;
const legend=document.getElementById("legend");
Layers.forEach(l=>{
  const row=document.createElement("div"); row.className="lrow";
  row.innerHTML='<span class="sw" style="background:'+l.color+'"></span><span class="nm">'+esc(l.name)+'</span><span class="ct">'+l.count+'</span>';
  row.onclick=()=>{ hidden[l.id]=!hidden[l.id]; row.classList.toggle("off",hidden[l.id]); draw(); };
  legend.appendChild(row);
});
const tbody=document.getElementById("tourBody");
DATA.tour.forEach(s=>{
  const d=document.createElement("div"); d.className="tstep";
  d.innerHTML='<div class="tt">'+s.o+'. '+esc(s.t)+'</div><div class="td">'+esc(s.d)+'</div>';
  d.onclick=()=>{ d.classList.toggle("open"); focusIds(s.ids); };
  tbody.appendChild(d);
});
document.getElementById("tourToggle").onclick=()=>{ tbody.style.display=tbody.style.display==="none"?"block":"none"; };
function focusIds(ids){
  const set=new Set(ids), pts=N.filter(n=>set.has(n.id)); if(!pts.length)return;
  pts.forEach(n=>{hidden[n.l]=false;}); if(pts.some(n=>isFn(n.t))){showFns=true;document.getElementById("showFns").checked=true;}
  let cx=0,cy=0; pts.forEach(n=>{cx+=n.x;cy+=n.y;}); cx/=pts.length; cy/=pts.length;
  scale=1.5; tx=cv.clientWidth/2-cx*scale; ty=cv.clientHeight/2-cy*scale;
  select(pts[0]);
  document.querySelectorAll(".lrow").forEach((r,i)=>r.classList.toggle("off",!!hidden[Layers[i].id]));
  draw();
}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim();draw();});
document.getElementById("showFns").addEventListener("change",e=>{showFns=e.target.checked;draw();});
document.getElementById("showEdges").addEventListener("change",e=>{showEdges=e.target.checked;draw();});
document.getElementById("stats").textContent=N.length.toLocaleString()+" nodes · "+Edg.length.toLocaleString()+" edges · "+Layers.length+" layers";
window.addEventListener("resize",resize);
fit(); resize();
</script>
