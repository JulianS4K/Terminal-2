<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 360px; font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
    .muted { color: #777; }
    .pill { padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .on { background: #2e7d32; color: #fff; }
    .off { background: #9e9e9e; color: #fff; }
    fieldset { border: 1px solid #ccc3; border-radius: 6px; margin: 10px 0 0; padding: 8px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; font-size: 11px; color: #777; margin: 6px 0 2px; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; font: 12px monospace; padding: 4px; }
    textarea { height: 56px; resize: vertical; }
    button { font: 12px system-ui; padding: 5px 10px; margin-top: 8px; cursor: pointer; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    #last { font-size: 12px; }
    #err { color: #c62828; font-size: 11px; white-space: pre-wrap; }
    ul { margin: 6px 0 0; padding-left: 16px; max-height: 130px; overflow: auto; }
    li { font-size: 11px; margin: 2px 0; }
    code { font-family: monospace; }
  </style>
</head>
<body>
  <h1>Broadway Availability Collector <span id="state" class="pill off">local</span></h1>

  <div class="row"><span class="muted">Total captured</span><b id="total">0</b></div>
  <div class="row"><span class="muted">Last capture</span><span id="last">—</span></div>
  <div id="err"></div>

  <fieldset>
    <legend>Recent</legend>
    <ul id="list"></ul>
  </fieldset>

  <fieldset>
    <legend>Ship to Supabase (optional)</legend>
    <label for="url">Ingest URL (edge function or REST/RPC endpoint)</label>
    <input id="url" type="text" placeholder="https://&lt;project&gt;.supabase.co/functions/v1/broadway-ingest" />
    <label for="headers">Headers (JSON) — e.g. {"x-ingest-secret":"…"} or {"apikey":"…","Authorization":"Bearer …"}</label>
    <textarea id="headers" placeholder='{"x-ingest-secret":"…"}'></textarea>
    <label><input id="enabled" type="checkbox" /> Enabled (ship captures live)</label>
    <div class="btns"><button id="save">Save config</button></div>
  </fieldset>

  <div class="btns">
    <button id="export">Export JSON</button>
    <button id="clear">Clear</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
