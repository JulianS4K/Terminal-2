<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exos — Embed Event</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style type="text/tailwindcss">
  @theme { --color-brand-primary:#00FF00; --font-sans:"Inter", ui-sans-serif, system-ui, sans-serif; --font-display:"Anton",sans-serif; }
  @layer base { body { @apply font-sans antialiased bg-transparent text-white; } }
</style>
<style>
  .disp{ font-family:"Anton",sans-serif; } .type{ font-family:"Special Elite",monospace; }
  .neon{ color:#00FF00; text-shadow:0 0 12px rgba(0,255,0,.4); } .xerox{ filter:grayscale(1) contrast(1.3); }
  .stamp{ font-family:"Anton",sans-serif; border:2.5px solid currentColor; padding:0 6px 2px; display:inline-block; line-height:1.15; }
  /* host-page hint background — the embed itself is the card only */
  body{ background:radial-gradient(circle at 85% -5%, rgba(0,255,0,.05), transparent 42%), radial-gradient(circle at 0% 100%, rgba(255,0,255,.04), transparent 45%), #050505; padding:28px; }
</style>
</head>
<body>
<p class="type text-[10px] uppercase tracking-widest text-slate-500 mb-3 max-w-md">↳ chromeless card — drops into any venue site via &lt;iframe src="exos.live/embed/event/…"&gt;</p>
<!-- THE EMBED (chromeless, no navbar/footer) -->
<div class="max-w-md bg-[#0a0a0a] border border-white/10 overflow-hidden">
  <div class="relative h-44 overflow-hidden">
    <img src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=800" class="xerox w-full h-full object-cover" alt="" />
    <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-transparent"></div>
    <span class="disp absolute top-3 left-3 bg-brand-primary text-black px-2 text-sm tracking-wide">TECHNO</span>
    <div class="absolute bottom-3 left-4 right-4"><h3 class="disp text-3xl leading-[0.9] tracking-tight">BASEMENT: SHDW B2B KALTAR</h3></div>
  </div>
  <div class="p-5">
    <div class="flex items-center justify-between mb-4 type text-[11px] uppercase tracking-widest text-white/50">
      <span>Fri 11 Jul · 11:00 PM</span><span>Knockdown Center</span>
    </div>
    <div class="flex items-center justify-between mb-4">
      <div><p class="type text-[9px] uppercase tracking-widest text-white/30 mb-0.5">from</p><span class="stamp neon text-lg">$30+</span></div>
      <div class="flex items-center gap-2 bg-black border border-white/10 p-1.5">
        <button class="w-8 h-8 bg-white/5 flex items-center justify-center"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/></svg></button>
        <span class="disp text-xl w-6 text-center">2</span>
        <button class="w-8 h-8 bg-white/5 flex items-center justify-center"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
    </div>
    <button class="disp w-full bg-brand-primary text-black py-3 text-lg tracking-wide hover:scale-[1.01] transition-transform">GRAB TICKETS</button>
    <p class="type text-[9px] uppercase tracking-[0.25em] text-white/25 text-center mt-3">▲ secured by exos</p>
  </div>
</div>
</body>
</html>
