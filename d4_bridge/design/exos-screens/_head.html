<!-- Shared head reference: Tailwind v4 browser + Exos @theme tokens (mirrors d4_bridge/src/index.css). Copy into each screen file's <head>. -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style type="text/tailwindcss">
  @theme {
    --color-brand-primary: #00FF00;
    --color-brand-secondary: #FF00FF;
    --color-brand-accent: #FF3B3B;
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Outfit", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    --color-tm-blue: #026cdf;
    --color-tm-gray: #f2f4f7;
  }
  @layer base {
    body { @apply font-sans antialiased bg-black text-white; }
  }
  .primary-card { @apply bg-[#111111] border border-white/10 hover:border-white/30 transition-all duration-300; }
  .primary-button { @apply bg-[#00FF00] text-black font-black uppercase italic tracking-tighter px-8 py-4 hover:scale-[1.02] active:scale-[0.98] transition-all; }
  .primary-heading { @apply font-display font-black uppercase italic tracking-tighter; }
  .text-neon { @apply text-brand-primary; text-shadow: 0 0 10px rgba(0,255,0,0.3); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { @apply bg-black; }
  ::-webkit-scrollbar-thumb { @apply bg-white/10 rounded-full hover:bg-white/20; }
</style>
