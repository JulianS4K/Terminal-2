<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exos — Check-In</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Permanent+Marker&Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style type="text/tailwindcss">
  @theme { --color-brand-primary:#00FF00; --color-tm-blue:#026cdf; --font-sans:"Inter", ui-sans-serif, system-ui, sans-serif; --font-display:"Anton",sans-serif; }
  @layer base { body { @apply font-sans antialiased bg-[#f2f4f7] text-slate-900; } }
</style>
<style>
  .disp{ font-family:"Anton",sans-serif; } .type{ font-family:"Special Elite",monospace; }
  @keyframes scanline{ 0%{ top:8%; } 100%{ top:92%; } }
  .scanline{ animation:scanline 2s ease-in-out infinite alternate; }
  @keyframes pulse2{ 50%{ opacity:.4; } }
</style>
<style>/*punk-stitch*/ .marker{font-family:"Permanent Marker",cursive;} .disp{font-family:"Anton",sans-serif;}</style>
</head>
<body class="bg-[#f2f4f7] text-slate-900">
<nav class="sticky top-0 z-50 bg-black border-b border-white/5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between h-20 items-center">
    <a href="Home.html" class="flex items-center gap-2 group"><div class="w-11 h-11 bg-white flex items-center justify-center group-hover:bg-brand-primary transition-colors"><svg class="text-black w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg></div><span class="text-3xl font-black tracking-tighter text-white italic">EXOS</span></a>
    <div class="flex items-center gap-3 bg-white/5 p-1 pr-4 border border-white/10"><div class="w-9 h-9 bg-brand-primary text-black font-black italic flex items-center justify-center">K</div></div>
  </div></div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-10">
  <a href="OrganizerDashboard.html" class="flex items-center gap-2 text-slate-500 hover:text-slate-900 text-[10px] font-black uppercase tracking-widest mb-6"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to dashboard</a>
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
    <div>
      <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Door Check-In</p>
      <span class="inline-flex items-baseline gap-3 flex-wrap"><h1 class="text-3xl md:text-4xl font-bold tracking-tight">Basement: SHDW b2b Kaltar</h1><span class="marker text-[#FF00FF] text-lg rotate-[-3deg] leading-none whitespace-nowrap">at the door ✦</span></span>
    </div>
    <div class="flex items-center gap-3">
      <label class="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2.5 rounded text-[11px] font-bold uppercase tracking-widest text-slate-600 shadow-sm cursor-pointer">
        <span class="w-9 h-5 bg-green-500 rounded-full relative"><span class="absolute top-0.5 right-0.5 w-4 h-4 bg-white rounded-full"></span></span> Offline ready
      </label>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- SCANNER STAGE (dark) -->
    <div class="lg:col-span-2">
      <div class="bg-black rounded-2xl overflow-hidden border border-slate-800 relative">
        <!-- camera viewport -->
        <div class="relative aspect-[4/3] bg-gradient-to-br from-[#141414] to-[#0a0a0a] overflow-hidden">
          <div class="absolute inset-0 opacity-25"><img src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=800" class="w-full h-full object-cover" style="filter:grayscale(1) contrast(1.2)" alt="" /></div>
          <!-- reticle -->
          <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-56 h-56">
            <div class="absolute -top-1 -left-1 w-10 h-10 border-t-4 border-l-4 border-brand-primary"></div>
            <div class="absolute -top-1 -right-1 w-10 h-10 border-t-4 border-r-4 border-brand-primary"></div>
            <div class="absolute -bottom-1 -left-1 w-10 h-10 border-b-4 border-l-4 border-brand-primary"></div>
            <div class="absolute -bottom-1 -right-1 w-10 h-10 border-b-4 border-r-4 border-brand-primary"></div>
            <div class="scanline absolute left-2 right-2 h-0.5 bg-brand-primary shadow-[0_0_12px_#00FF00]"></div>
          </div>
          <div class="absolute top-4 left-4 flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-white/80"><span class="w-2 h-2 bg-brand-primary rounded-full animate-ping"></span> Scanning…</div>
          <div class="absolute bottom-4 left-0 right-0 text-center type text-[11px] uppercase tracking-widest text-white/40">point camera at the rotating QR pass</div>
        </div>
        <!-- last result overlay bar -->
        <div class="bg-green-500 text-black px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
            <div><p class="disp text-2xl leading-none tracking-wide">ADMIT</p><p class="type text-[11px] uppercase tracking-widest">Riley Okafor · General Admission</p></div>
          </div>
          <span class="type text-[11px] uppercase tracking-widest">TKT_8F2A91</span>
        </div>
      </div>

      <!-- manual entry -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mt-6">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Manual entry — no camera?</p>
        <div class="flex gap-2">
          <input placeholder="Enter pass ID or last 6 digits…" class="flex-1 bg-slate-50 border border-slate-200 rounded px-4 py-3 text-sm font-mono focus:outline-none focus:border-tm-blue" />
          <button class="bg-slate-900 text-white px-6 py-3 rounded font-bold text-xs uppercase tracking-widest hover:bg-slate-700">Check</button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR: stats + log -->
    <div class="space-y-6">
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 text-center"><p class="text-2xl font-bold tracking-tight text-green-600">142</p><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">In</p></div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 text-center"><p class="text-2xl font-bold tracking-tight text-slate-900">284</p><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">Sold</p></div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 text-center"><p class="text-2xl font-bold tracking-tight text-rose-500">3</p><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">Rejects</p></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between"><h2 class="text-sm font-black text-slate-900 uppercase tracking-widest">Scan log</h2><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">live</span></div>
        <ul id="log" class="divide-y divide-slate-50 max-h-[420px] overflow-y-auto"></ul>
      </div>
    </div>
  </div>
</div>

<script>
  const log = [
    { ok:true, n:'Riley Okafor', tier:'General Admission', t:'11:42:08' },
    { ok:true, n:'Jordan Vega', tier:'Early Entry + Bar', t:'11:41:55' },
    { ok:false, n:'—', tier:'Already scanned', t:'11:41:40' },
    { ok:true, n:'Amina Farah', tier:'General Admission', t:'11:41:22' },
    { ok:true, n:'Chris Diallo', tier:'General Admission', t:'11:40:59' },
    { ok:false, n:'—', tier:'Wrong event', t:'11:40:31' },
    { ok:true, n:'Sam Okonkwo', tier:'Early Entry + Bar', t:'11:40:12' },
    { ok:true, n:'Lena Brandt', tier:'General Admission', t:'11:39:48' },
  ];
  document.getElementById('log').innerHTML = log.map(e=>`
    <li class="flex items-center gap-3 px-5 py-3">
      <span class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${e.ok?'bg-green-50 text-green-600':'bg-rose-50 text-rose-500'}">
        ${e.ok?'<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':'<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'}
      </span>
      <div class="min-w-0 flex-1"><p class="text-sm font-bold text-slate-800 truncate">${e.ok?e.n:'Rejected'}</p><p class="text-[11px] text-slate-400 truncate">${e.tier}</p></div>
      <span class="text-[10px] font-mono text-slate-300 shrink-0">${e.t}</span>
    </li>`).join('');
</script>
</body>
</html>
