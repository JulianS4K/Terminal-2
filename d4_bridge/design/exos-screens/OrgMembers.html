<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exos — Org Members</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style type="text/tailwindcss">
  @theme { --color-brand-primary:#00FF00; --color-tm-blue:#026cdf; --font-sans:"Inter", ui-sans-serif, system-ui, sans-serif; }
  @layer base { body { @apply font-sans antialiased bg-[#f2f4f7] text-slate-900; } }
  .card{ @apply bg-white rounded-2xl border border-slate-200 shadow-sm; }
</style>
<style>/*punk-stitch*/ .marker{font-family:"Permanent Marker",cursive;} .disp{font-family:"Anton",sans-serif;}</style>
</head>
<body class="bg-[#f2f4f7] text-slate-900">
<nav class="sticky top-0 z-50 bg-black border-b border-white/5"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between h-20 items-center">
  <a href="Home.html" class="flex items-center gap-2 group"><div class="w-11 h-11 bg-white flex items-center justify-center group-hover:bg-brand-primary transition-colors"><svg class="text-black w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg></div><span class="text-3xl font-black tracking-tighter text-white italic">EXOS</span></a>
  <div class="flex items-center gap-3 bg-white/5 p-1 pr-4 border border-white/10"><div class="w-9 h-9 bg-brand-primary text-black font-black italic flex items-center justify-center">K</div></div>
</div></div></nav>

<div class="max-w-5xl mx-auto px-4 py-10">
  <a href="OrgSettings.html" class="flex items-center gap-2 text-slate-500 hover:text-slate-900 text-[10px] font-black uppercase tracking-widest mb-6"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Knockdown Presents</a>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Team</p><span class="inline-flex items-baseline gap-3 flex-wrap"><h1 class="text-3xl md:text-4xl font-bold tracking-tight">Members</h1><span class="marker text-[#FF00FF] text-lg rotate-[-3deg] leading-none whitespace-nowrap">the team ✦</span></span></div>
  </div>

  <div class="flex gap-6 border-b border-slate-200 mb-8">
    <a href="OrgSettings.html" class="pb-3 text-sm font-bold text-slate-400 hover:text-slate-600">General</a>
    <button class="pb-3 text-sm font-bold text-slate-900 border-b-2 border-tm-blue -mb-px">Members</button>
    <button class="pb-3 text-sm font-bold text-slate-400 hover:text-slate-600">Billing</button>
  </div>

  <!-- invite -->
  <div class="card p-6 mb-6">
    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Invite a teammate</p>
    <div class="flex flex-col sm:flex-row gap-3">
      <input class="flex-1 bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-tm-blue" placeholder="email@venue.com" />
      <select class="bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm font-bold focus:outline-none focus:border-tm-blue"><option>Manager</option><option>Finance</option><option>Scanner</option><option>Content</option></select>
      <button class="bg-tm-blue text-white px-6 py-3 rounded font-bold text-sm hover:bg-[#015bbd]">Send invite</button>
    </div>
  </div>

  <div class="card overflow-hidden">
    <table class="w-full text-left"><thead><tr class="bg-slate-50 border-b border-slate-100">
      <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Member</th>
      <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Role</th>
      <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Status</th>
      <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Actions</th>
    </tr></thead><tbody class="divide-y divide-slate-50" id="mem"></tbody></table>
  </div>
</div>

<script>
  const roleColor={Owner:'bg-slate-900 text-white',Manager:'bg-blue-50 text-tm-blue border border-blue-100',Finance:'bg-emerald-50 text-emerald-700 border border-emerald-100',Scanner:'bg-amber-50 text-amber-700 border border-amber-100',Content:'bg-violet-50 text-violet-700 border border-violet-100'};
  const members=[
    { n:'Kaya Reyes', e:'kaya@knockdown.nyc', role:'Owner', s:'active', init:'K' },
    { n:'Marcus Vale', e:'marcus@knockdown.nyc', role:'Manager', s:'active', init:'M' },
    { n:'Priya Anand', e:'priya@knockdown.nyc', role:'Finance', s:'active', init:'P' },
    { n:'Door Team', e:'door@knockdown.nyc', role:'Scanner', s:'active', init:'D' },
    { n:'—', e:'social@knockdown.nyc', role:'Content', s:'pending', init:'?' },
  ];
  document.getElementById('mem').innerHTML = members.map(m=>`
    <tr class="hover:bg-slate-50/50">
      <td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-500">${m.init}</div><div><p class="font-bold text-sm">${m.n}</p><p class="text-[11px] text-slate-400">${m.e}</p></div></div></td>
      <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest ${roleColor[m.role]}">${m.role}</span></td>
      <td class="px-6 py-4">${m.s==='active'?'<span class="text-[10px] font-bold text-green-600 uppercase tracking-widest">● Active</span>':'<span class="text-[10px] font-bold text-amber-500 uppercase tracking-widest">◔ Invite sent</span>'}</td>
      <td class="px-6 py-4 text-right">${m.role==='Owner'?'<span class="text-[10px] text-slate-300 font-bold uppercase tracking-widest">—</span>':'<button class="text-slate-400 hover:text-rose-500 text-[10px] font-black uppercase tracking-widest">Remove</button>'}</td>
    </tr>`).join('');
</script>
</body>
</html>
