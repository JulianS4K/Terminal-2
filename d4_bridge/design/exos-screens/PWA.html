<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exos — PWA Phone View</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style type="text/tailwindcss">
  @theme { --color-brand-primary:#00FF00; --font-sans:"Inter", ui-sans-serif, system-ui, sans-serif; --font-display:"Anton", sans-serif; }
  @layer base { body { @apply font-sans antialiased; } }
</style>
<style>
  .disp{ font-family:"Anton",sans-serif; } .type{ font-family:"Special Elite",monospace; }
  body{ background:radial-gradient(circle at 50% 0%, #14181c, #050505 60%); min-height:100vh; }
  .phone{ position:relative; width:392px; height:812px; background:#0a0a0a; border-radius:56px;
    box-shadow: inset 0 0 0 2px #2a2a2a, 0 0 0 13px #131313, 0 0 0 15px #2c2c2c, 0 40px 90px rgba(0,0,0,.7); }
  .screen{ position:absolute; inset:13px; border-radius:44px; overflow:hidden; background:#050505; }
  .island{ position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:32px; background:#000; border-radius:18px; z-index:30; }
  .statusbar{ position:absolute; top:0; left:0; right:0; height:52px; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:16px 30px 0; color:#fff; pointer-events:none; }
  .appframe{ position:absolute; top:52px; left:0; right:0; bottom:0; width:100%; border:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .ring{ width:52px; height:52px; border:4px solid rgba(0,255,0,.2); border-top-color:#00FF00; border-radius:50%; animation:spin .8s linear infinite; }
  .homebar{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:130px; height:5px; background:rgba(255,255,255,.85); border-radius:3px; z-index:30; }
</style>
</head>
<body class="text-white">
<div class="max-w-6xl mx-auto px-6 py-16">
  <div class="text-center mb-14">
    <p class="type text-brand-primary text-[12px] uppercase tracking-[0.3em] mb-3">// installed · standalone · no browser chrome</p>
    <h1 class="disp text-5xl md:text-6xl tracking-tight" style="transform:skewX(-4deg)">EXOS <span style="color:#00FF00;text-shadow:0 0 16px rgba(0,255,0,.4)">PWA</span></h1>
    <p class="type text-white/50 text-sm mt-3">Add to Home Screen → launches fullscreen. theme-color #0A0A0A · brand glyph icon.</p>
  </div>

  <div class="flex flex-wrap items-start justify-center gap-16">
    <!-- SPLASH -->
    <div class="flex flex-col items-center gap-5">
      <div class="phone">
        <div class="island"></div>
        <div class="screen">
          <div class="statusbar"><span class="type text-[13px] font-bold">9:41</span><span class="flex items-center gap-1.5"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h2v-8H2v8Zm4 0h2V10H6v12Zm4 0h2V6h-2v16Zm4 0h2V2h-2v20Z"/></svg><svg class="w-5 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="7" width="18" height="10" rx="2.5"/><rect x="20" y="10" width="2" height="4" rx="1"/></svg></span></div>
          <div class="absolute inset-0 flex flex-col items-center justify-center gap-8" style="background:#0a0a0a">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 bg-white flex items-center justify-center"><svg class="text-black w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg></div>
              <span class="disp text-5xl tracking-tight leading-none pt-1" style="transform:skewX(-6deg)">EXOS</span>
            </div>
            <div class="ring"></div>
          </div>
          <div class="homebar"></div>
        </div>
      </div>
      <p class="type text-white/40 text-[11px] uppercase tracking-widest">launch splash</p>
    </div>

    <!-- RUNNING APP -->
    <div class="flex flex-col items-center gap-5">
      <div class="phone">
        <div class="island"></div>
        <div class="screen">
          <div class="statusbar"><span class="type text-[13px] font-bold">9:41</span><span class="flex items-center gap-1.5"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h2v-8H2v8Zm4 0h2V10H6v12Zm4 0h2V6h-2v16Zm4 0h2V2h-2v20Z"/></svg><svg class="w-5 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="7" width="18" height="10" rx="2.5"/><rect x="20" y="10" width="2" height="4" rx="1"/></svg></span></div>
          <iframe class="appframe" src="Home.html" title="Exos running as PWA" scrolling="yes" style="height:calc(100% - 52px)"></iframe>
          <div class="homebar"></div>
        </div>
      </div>
      <p class="type text-white/40 text-[11px] uppercase tracking-widest">home · running fullscreen</p>
    </div>
  </div>
</div>
</body>
</html>
