<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exos — Create Event</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style type="text/tailwindcss">
  @theme { --color-brand-primary:#00FF00; --color-tm-blue:#026cdf; --font-sans:"Inter", ui-sans-serif, system-ui, sans-serif; }
  @layer base { body { @apply font-sans antialiased bg-[#f2f4f7] text-slate-900; } }
  .lbl{ @apply block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2; }
  .fld{ @apply w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-tm-blue focus:ring-2 focus:ring-tm-blue/15; }
  .card{ @apply bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8; }
</style>
<style>/*punk-stitch*/ .marker{font-family:"Permanent Marker",cursive;} .disp{font-family:"Anton",sans-serif;}</style>
</head>
<body class="bg-[#f2f4f7] text-slate-900">
<nav class="sticky top-0 z-50 bg-black border-b border-white/5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between h-20 items-center">
    <a href="Home.html" class="flex items-center gap-2 group"><div class="w-11 h-11 bg-white flex items-center justify-center group-hover:bg-brand-primary transition-colors"><svg class="text-black w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg></div><span class="text-3xl font-black tracking-tighter text-white italic">EXOS</span></a>
    <div class="flex items-center gap-3 bg-white/5 p-1 pr-4 border border-white/10"><div class="w-9 h-9 bg-brand-primary text-black font-black italic flex items-center justify-center">K</div></div>
  </div></div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-10">
  <a href="OrganizerDashboard.html" class="flex items-center gap-2 text-slate-500 hover:text-slate-900 text-[10px] font-black uppercase tracking-widest mb-6"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to dashboard</a>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">New Event</p><span class="inline-flex items-baseline gap-3 flex-wrap"><h1 class="text-3xl md:text-4xl font-bold tracking-tight">Create Event</h1><span class="marker text-[#FF00FF] text-lg rotate-[-3deg] leading-none whitespace-nowrap">new drop ✦</span></span></div>
    <div class="flex gap-3">
      <button class="bg-white text-slate-900 border border-slate-200 px-6 py-3 rounded font-bold text-sm hover:bg-slate-50 shadow-sm">Save Draft</button>
      <button class="bg-tm-blue text-white px-6 py-3 rounded font-bold text-sm hover:bg-[#015bbd] shadow-sm">Publish</button>
    </div>
  </div>

  <div class="space-y-6">
    <!-- basics -->
    <div class="card">
      <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">Event Details</h2>
      <div class="space-y-5">
        <div><label class="lbl">Title</label><input class="fld" placeholder="e.g. Basement: SHDW b2b Kaltar" /></div>
        <div><label class="lbl">Description</label><textarea rows="4" class="fld resize-none" placeholder="Tell fans what the night is about…"></textarea></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div><label class="lbl">Category</label><select class="fld"><option>Techno</option><option>House</option><option>Live / Indie</option><option>Hip-Hop</option><option>Warehouse</option></select></div>
          <div><label class="lbl">Genres</label>
            <div class="flex flex-wrap gap-2 bg-white border border-slate-200 rounded-lg px-3 py-2.5">
              <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full">Techno <span class="text-slate-400">×</span></span>
              <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full">Hard Groove <span class="text-slate-400">×</span></span>
              <input class="flex-1 min-w-[80px] text-sm focus:outline-none" placeholder="add…" />
            </div>
          </div>
        </div>
        <div><label class="lbl">Performers</label>
          <div class="flex flex-wrap gap-2 bg-white border border-slate-200 rounded-lg px-3 py-2.5">
            <span class="inline-flex items-center gap-1 bg-blue-50 text-tm-blue text-xs font-bold px-2.5 py-1 rounded-full">SHDW <span>×</span></span>
            <span class="inline-flex items-center gap-1 bg-blue-50 text-tm-blue text-xs font-bold px-2.5 py-1 rounded-full">Kaltar <span>×</span></span>
            <span class="inline-flex items-center gap-1 bg-blue-50 text-tm-blue text-xs font-bold px-2.5 py-1 rounded-full">NADI <span>×</span></span>
            <input class="flex-1 min-w-[80px] text-sm focus:outline-none" placeholder="add performer…" />
          </div>
        </div>
      </div>
    </div>

    <!-- media -->
    <div class="card">
      <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">Poster</h2>
      <div class="border-2 border-dashed border-slate-200 rounded-xl p-10 text-center hover:border-tm-blue transition-colors cursor-pointer">
        <svg class="w-10 h-10 text-slate-300 mx-auto mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <p class="text-sm font-bold text-slate-600">Drop a poster or click to upload</p>
        <p class="text-xs text-slate-400 mt-1">JPG or PNG · 3:4 recommended · up to 8MB</p>
      </div>
    </div>

    <!-- date/time -->
    <div class="card">
      <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">Date &amp; Time</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div><label class="lbl">Event date</label><input type="date" value="2026-07-11" class="fld" /></div>
        <div><label class="lbl">Timezone</label><select class="fld"><option>America/New_York (ET)</option><option>America/Chicago (CT)</option><option>America/Los_Angeles (PT)</option></select></div>
        <div><label class="lbl">Doors open</label><input type="time" value="22:00" class="fld" /></div>
        <div><label class="lbl">Show start</label><input type="time" value="23:00" class="fld" /></div>
      </div>
    </div>

    <!-- location -->
    <div class="card">
      <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">Location</h2>
      <div class="space-y-5">
        <div><label class="lbl">Venue name</label><input class="fld" value="Knockdown Center" /></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div class="sm:col-span-2"><label class="lbl">Street</label><input class="fld" value="52-19 Flushing Ave" /></div>
          <div><label class="lbl">City</label><input class="fld" value="Maspeth" /></div>
          <div><label class="lbl">Region</label><input class="fld" value="NY" /></div>
        </div>
      </div>
    </div>

    <!-- tiers -->
    <div class="card">
      <div class="flex items-center justify-between mb-6"><h2 class="text-sm font-black text-slate-900 uppercase tracking-widest">Ticket Tiers</h2><button class="text-tm-blue text-[11px] font-black uppercase tracking-widest hover:underline flex items-center gap-1"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add tier</button></div>
      <div class="space-y-4" id="tiers"></div>
    </div>

    <!-- limits -->
    <div class="card">
      <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">Purchase Limits</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div><label class="lbl">Max per order</label><input type="number" value="8" class="fld" /></div>
        <div><label class="lbl">Max per account</label><input type="number" value="8" class="fld" /></div>
      </div>
    </div>

    <div class="flex justify-end gap-3 pb-4">
      <button class="bg-white text-slate-900 border border-slate-200 px-6 py-3 rounded font-bold text-sm hover:bg-slate-50 shadow-sm">Save Draft</button>
      <button class="bg-tm-blue text-white px-8 py-3 rounded font-bold text-sm hover:bg-[#015bbd] shadow-sm">Publish Event</button>
    </div>
  </div>
</div>

<script>
  const tiers = [
    { n:'General Admission', p:'30', c:'350', d:'Standing room, all-night access' },
    { n:'Early Entry + Bar', p:'55', c:'50', d:'9pm entry, first-hour open bar' },
  ];
  document.getElementById('tiers').innerHTML = tiers.map(t=>`
    <div class="border border-slate-200 rounded-xl p-5 relative">
      <button class="absolute top-4 right-4 text-slate-300 hover:text-rose-500"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
        <div class="sm:col-span-1"><label class="lbl">Tier name</label><input class="fld" value="${t.n}" /></div>
        <div><label class="lbl">Price ($)</label><input class="fld" value="${t.p}" /></div>
        <div><label class="lbl">Capacity</label><input class="fld" value="${t.c}" /></div>
      </div>
      <div><label class="lbl">Description</label><input class="fld" value="${t.d}" /></div>
    </div>`).join('');
</script>
</body>
</html>
