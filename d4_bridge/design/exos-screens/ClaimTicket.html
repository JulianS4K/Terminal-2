<style type="text/tailwindcss">

<body class="wall grain text-white">
<nav class="sticky top-0 z-50 bg-black/90 border-b border-white/10">

        <p class="type text-[10px] text-white/30 uppercase tracking-widest mb-1">invitation for</p>

        <div class="flex items-center gap-3">

          <span class="type text-[9px] text-brand-primary bg-brand-primary/10 border border-brand-primary/30 px-3 py-1 uppercase tracking-widest">verified</span>
        </div>
      </div>
    </div>

    <div class="p-8 bg-black/40">
      <div class="bg-white/5 border border-white/10 p-7 mb-8">
        <div class="flex items-center justify-between mb-6">
          <div><p class="type text-[9px] text-white/30 uppercase tracking-widest mb-1">from</p><p class="disp text-lg tracking-tight">SECURE SENDER</p></div>

        </div>
        <div class="pt-5 border-t border-white/5 flex items-center justify-center gap-2">
          <svg class="w-4 h-4 text-brand-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
          <span class="type text-[10px] text-white/40 uppercase tracking-widest">ready to claim</span>
        </div>
      </div>
      <button class="disp w-full bg-brand-primary text-black py-4 text-xl tracking-wide hover:scale-[1.01] transition-transform">CLAIM TICKET</button>
    </div>
