# Render blueprint for the Timberwolves browser worker.
#
# OWNER: A1 (collector). Operator 2026-11-23: "start the timberwolves poller and test and then merge",
# choosing the browser worker. The Timberwolves' ticket site shows a game's seats only after the page has
# loaded, so a headless browser opens each game's public page every 10 minutes and stores the listings
# the page shows (core/primary_poll_browser.py). It serves no HTTP: a background worker.
#
# It writes through primary_poll_ingest() into the same tables the web service's worker fills for
# SI Tickets (mig 20261123171030). ONE POLLER A SOURCE: when this service is live, the web service must
# have PRIMARY_POLL_SOURCES=sitickets, or the two would overwrite the Timberwolves' rows every cycle.
#
# Plan: standard (2 GB). Measured on the first runs (2026-11-23): 440 to 480 MB while a run is under way,
# which is at the edge of the starter plan's 512 MB, so standard stays.
#
# The on/off switch, PRIMARY_POLL_BROWSER_LIVE, is set on the service itself (`sync: false`), not here, so a
# later sync of this file does not switch the worker off. A Render write: an Applier action (CLAUDE.md §4).
#
# Created 2026-11-23 as s4k-primary-poll-browser-ksun (srv-dc287po8v5cc73bs8qsg), blueprint
# exs-dc287ng8v5cc73bs8kd0, automatic sync off. Render adds the suffix. Switched on the same day
# (operator: "apply and switch on"); first full run 30 of 30 games.

services:
  - type: worker
    name: s4k-primary-poll-browser
    runtime: docker
    dockerfilePath: ./Dockerfile.primary-poll-browser
    plan: standard
    region: oregon          # same region as the main service
    branch: main
    autoDeploy: true
    envVars:
      - key: PRIMARY_POLL_BROWSER_LIVE
        sync: false         # set on the service: 1 runs the worker, anything else keeps it off
      - key: PRIMARY_POLL_INTERVAL_SECONDS
        value: "600"
      - key: SUPABASE_URL
        fromService:
          type: web
          name: vibepass-storefront-test
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: vibepass-storefront-test
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
