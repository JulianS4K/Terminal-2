# Mutation-testing config (testing-recommendation #6). ONLY the [mutmut]
# section lives here — there is intentionally no [tool:pytest] section, so
# pytest ignores this file (its config stays CLI-driven + .coveragerc). See
# scripts/run_mutation_tests.sh for how/why to run a campaign.
[mutmut]
source_paths =
    core/auth.py
    core/ratelimit.py
runner = python -m pytest -x -q --no-header -p no:cacheprovider tests/test_core_auth.py tests/test_core_ratelimit.py tests/test_runtime_failure.py
