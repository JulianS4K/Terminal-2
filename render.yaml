# Render.com Infrastructure-as-Code blueprint for the storefront test env.
#
# OWNER: D1 (Consumer Retail) — per LANE_DISCIPLINE.md §Cross-cutting Rule #6.
# Service: vibepass-storefront-test (srv-d8140bnaqgkc73al4asg)
# Companion blueprint for D2's service: render-d2-dashboard.yaml
#
# Usage:
#   1. Connect this repo to Render (https://dashboard.render.com → New → Blueprint).
#   2. Point at this branch (claude/store-sql-only-demo-mode) or any branch
#      that contains render.yaml.
#   3. Render reads this file, prompts for the four `sync: false` secrets
#      (Supabase URL + 3 keys + CRON_SECRET), and provisions the service.
#   4. Every subsequent push to the connected branch auto-deploys.
#
# This blueprint deploys in STOREFRONT_SQL_ONLY=true demo mode by default
# (per Julian's 2026-05-11 direction: storefront serves from
# listings_snapshots, no live TEvo). Flip to "false" in the Render
# dashboard env vars to toggle live mode without redeploying.
#
# Plan: Starter ($7/mo) — always-warm dyno, 512MB RAM, no 15-min idle
# sleep. Upgraded from `free` 2026-05-15 because the cold-start TTI was
# ~14s on first visit (free-tier dyno sleeps after 15 min idle; first
# request times out at 30s, second is ~12s wait while uvicorn boots,
# third lands warm at ~250ms). Starter eliminates that — first-visit TTI
# drops to ~2s warm. Companion observability matrix in
# docs/d1-render-perf-2026-05-15.md (front-screen latency baseline).

services:
  - type: web
    name: vibepass-storefront-test
    runtime: python
    plan: starter
    region: oregon          # closest to Supabase us-east-2; tradeoff vs us-east-ohio (~50ms)
    # If your Supabase project is us-east-2 specifically, prefer 'ohio' region instead.
    branch: main
    autoDeploy: true        # every push to main redeploys (post-consolidation: A1 row 81 directive)

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /healthz
    # /healthz returns {"ok": true, ...} fast (<50ms warm, ~1s cold) and
    # doesn't load the storefront's static bundle. Previously /, but that
    # rendered the full landing page (90KB JS) + timed out the cold-dyno
    # healthcheck window on free tier — Sprint 1.5 deploy (a8f44d2) failed
    # for exactly that reason. /healthz boots cleanly even on cold start.

    envVars:
      # Pin to Python 3.12 — Render's auto-pick of 3.14.3 is brand-new and
      # some deps (notably supabase-py + pydantic-core) haven't fully baked
      # cp314 wheels. 3.12 is the most-tested current version.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # ---- Demo mode (the new flag this PR introduces) ----
      - key: STOREFRONT_SQL_ONLY
        value: "true"
      # ---- Storefront-as-landing flag ----
      # false (operator directive 2026-06-15): / serves the VibePass unified
      # hub (static/home/index.html) as the main screen — the 5-surface
      # selector (Terminal / Undelivered / Orders / Store / Bridge), auth-gated
      # in home.js. Set "true" to revert to the old behavior where / redirects
      # to /store (customers land directly on the storefront).
      - key: STOREFRONT_AS_LANDING
        value: "false"
      # ---- Storefront constants ----
      - key: ALLOWED_EMAIL_DOMAIN
        value: s4kent.com
      # ---- Secrets — Render prompts on first deploy, never bakes into git ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # ---- Render deploy-webhook → GitHub Actions bridge ----
      # Powers POST /webhooks/render (app.py + render_webhook.py), which fires
      # the post-deploy.yml smoke test on deploy-end. All optional: with none
      # set the route fails closed (401) and no workflow is dispatched.
      #   RENDER_WEBHOOK_SECRET — Standard Webhooks signing secret (`whsec_...`)
      #     from the Render webhook you create (Settings → Webhooks → DeployEnded).
      #   RENDER_API_KEY        — Render API token; enables the authoritative
      #     deploy-status + repo-match check (else falls back to payload status).
      #   GITHUB_API_TOKEN      — PAT with `actions:write` to dispatch the workflow.
      # The Render webhook itself (DeployEnded → /webhooks/render) is created
      # out-of-band via the Render API; its id is whk-d8jmmhcm0tmc73fflsk0.
      - key: RENDER_WEBHOOK_SECRET
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: GITHUB_API_TOKEN
        sync: false
      # Non-secret targets — plain IaC values (target repo for workflow_dispatch).
      - key: GITHUB_OWNER_NAME
        value: JulianS4K
      - key: GITHUB_REPO_NAME
        value: Terminal-2
      # GITHUB_WORKFLOW_ID defaults to "post-deploy.yml" in code; override here
      # only to dispatch a different workflow.
      # ---- DO NOT set TEVO_TOKEN / TEVO_SECRET here ----
      # The app reads them from Supabase `settings` table at boot. Setting
      # them as env vars would override Supabase, which we don't want.
      #
      # ---- DO NOT set RAILWAY_ENVIRONMENT=production or ENVIRONMENT=production ----
      # _is_production() would then return true and the /store/test/* debug
      # routes would 404. This is a test env; leave production indicators off.
